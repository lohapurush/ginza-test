body{width:100%;min-height:100vh;font-family:var(--body-font,-apple-system,'Segoe UI',sans-serif);font-size:13px;color:var(--t1);background:var(--pg);}
.orb{position:fixed;border-radius:50%;pointer-events:none;z-index:0;}
.orb1{width:600px;height:600px;background:radial-gradient(circle,var(--orb1) 0%,transparent 70%);top:-120px;left:-120px;}
.orb2{width:500px;height:500px;background:radial-gradient(circle,var(--orb2) 0%,transparent 70%);bottom:-100px;right:-100px;}
.panel{width:100%;min-height:100vh;padding:14px 18px;display:flex;flex-direction:column;gap:9px;position:relative;z-index:1;}
.surf{background:var(--surf-bg);border:1px solid var(--surf-bdr);box-shadow:var(--surf-shadow);border-radius:14px;}

/* toolbar */
.toolbar{display:flex;align-items:center;gap:8px;padding:9px 14px;flex-wrap:nowrap;}
.ttl{font-size:var(--ttl-size);font-weight:800;letter-spacing:-.3px;background:linear-gradient(135deg,var(--ttl-a),var(--ttl-b),var(--ttl-c));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;flex-shrink:0;font-family:var(--ttl-font);}
.sep{width:1px;height:20px;background:var(--sep-c);flex-shrink:0;}
.btn{height:32px;padding:0 12px;border:1px solid var(--btn-bdr);border-radius:9px;background:var(--btn-bg);color:var(--btn-t);font-size:12px;cursor:pointer;display:inline-flex;align-items:center;gap:5px;white-space:nowrap;font-family:inherit;transition:all .14s;}
.btn:hover{filter:brightness(1.04);border-color:var(--acc-bdr);}
.btn:active{transform:scale(.98);}
.btn:disabled{opacity:.42;cursor:not-allowed;transform:none;}
.lst{font-size:11px;color:var(--t3);white-space:nowrap;}
.init-bar{display:inline-flex;align-items:center;gap:7px;font-size:11px;color:var(--acc);padding:4px 10px;border-radius:7px;background:var(--acc-bg);border:1px solid var(--acc-bdr);}
.spin{width:13px;height:13px;border:2px solid var(--spin-c);border-top-color:var(--spin-top);border-radius:50%;animation:sp .6s linear infinite;flex-shrink:0;}
@keyframes sp{to{transform:rotate(360deg)}}
.theme-switcher{display:flex;align-items:center;gap:4px;padding:3px;border-radius:10px;background:var(--acc-bg);border:1px solid var(--acc-bdr);}
.theme-select{height:22px;padding:0 6px;border-radius:7px;border:none;font-size:10px;font-weight:600;cursor:pointer;font-family:inherit;color:var(--acc);background:var(--btn-bg);}
.theme-select:focus{outline:none;box-shadow:0 0 0 2px var(--acc-bdr);}
.theme-mode-btn{height:22px;width:28px;border-radius:7px;border:none;cursor:pointer;font-size:13px;transition:all .15s;color:var(--t3);background:transparent;display:flex;align-items:center;justify-content:center;}
.theme-mode-btn:hover{background:var(--btn-bg);}
.theme-mode-btn.active{background:var(--btn-bg);color:var(--acc);}

/* tabs */
.tabs-bar{display:flex;align-items:stretch;padding:0 14px;border-bottom:1px solid var(--inner-bdr);gap:0;}
.sc-tab{padding:8px 14px;font-size:12px;font-weight:500;cursor:pointer;border-bottom:2px solid transparent;color:var(--t3);display:flex;align-items:center;gap:6px;transition:color .12s;white-space:nowrap;user-select:none;}
.sc-tab:hover{color:var(--t2);}
.sc-tab.active{color:var(--acc);border-bottom-color:var(--acc);}
.tab-bdg{display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:17px;padding:0 5px;border-radius:9px;font-size:10px;font-weight:700;background:var(--acc-bg);color:var(--acc);}
.sc-tab.active .tab-bdg{background:var(--acc);color:var(--on-acc,#fff);}
.tab-bdg.warn{background:rgba(245,158,11,0.15);color:#d97706;}
.sc-tab.active .tab-bdg.warn{background:#d97706;color:#fff;}

/* week header — gap + padding MUST match .wk-grid or columns drift out of alignment */
.wk-hdr{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;padding:0 6px;border-bottom:1px solid var(--inner-bdr);}
.wk-day{padding:7px 6px;font-size:10px;text-align:center;color:var(--t3);background:var(--surf-bg);border-radius:6px 6px 0 0;}
.wk-day.today{color:var(--today-t);background:var(--today-bg);border-bottom:2px solid var(--today-bdr);}
.wk-day.weekend{background:var(--wknd-bg);}
.wk-day .dn{font-size:10px;font-weight:600;}
.wk-day .dd{font-size:10px;margin-top:1px;opacity:.7;}

/* board grid */
.wk-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;padding:6px;position:relative;min-height:120px;}
.wk-bg{grid-row:1/-1;border-radius:0 0 6px 6px;}
.wk-bg.today{background:var(--today-bg);}
.wk-bg.weekend{background:var(--wknd-bg);}
.ac.flash{animation:acflash 1.4s ease-out;}
@keyframes acflash{0%{box-shadow:0 0 0 3px var(--acc);}100%{box-shadow:0 0 0 0 transparent;}}
.wk-empty{min-height:120px;display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--t3);font-style:italic;}
/* overflow row — "+N more" when a day stack exceeds the row cap */
.ac-more{border-radius:7px;padding:5px 7px;font-size:10px;font-weight:600;cursor:pointer;background:var(--acc-bg);border:1px dashed var(--acc-bdr);color:var(--acc);display:flex;align-items:center;justify-content:center;transition:filter .1s;}
.ac-more:hover{filter:brightness(1.06);}
.ac:focus-visible,.ac-more:focus-visible,.sc-tab:focus-visible{outline:2px solid var(--acc);outline-offset:1px;}

/* assignment cards */
.ac{border-radius:7px;padding:5px 7px;margin-bottom:0;font-size:11px;line-height:1.45;cursor:pointer;transition:filter .1s,transform .1s;position:relative;border-left-width:3px;border-left-style:solid;overflow:hidden;}
.ac:hover{filter:brightness(.96);transform:translateY(-1px);}
.ac:active{transform:scale(.98);}
.ac.ilt{background:var(--mode-ilt-bg);color:var(--mode-ilt-t);border-left-color:var(--mode-ilt-bd);}
.ac.ilo{background:var(--mode-ilo-bg);color:var(--mode-ilo-t);border-left-color:var(--mode-ilo-bd);}
.ac.fmat{background:var(--mode-fmat-bg);color:var(--mode-fmat-t);border-left-color:var(--mode-fmat-bd);}
.ac.unalloc{background:var(--surf-bg);border:1px dashed var(--sep-c);color:var(--t3);border-left-width:3px;border-left-style:dashed;border-left-color:var(--mode-un-bd);}
.ac-vendor{opacity:.88;font-size:10px;}
.ac.tentative{border-style:dashed;}
.ac-dates{font-size:10px;opacity:.88;margin-top:2px;}
.ac-title{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.ac-trainer{opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px;}
.ac-meta{display:flex;align-items:center;gap:4px;margin-top:3px;flex-wrap:wrap;}
.ac-loc{opacity:.88;font-size:10px;}
.ac-sep{opacity:.45;font-size:10px;}
.ac-tag{display:inline-block;padding:0 4px;border-radius:3px;font-size:10px;font-weight:700;background:rgba(220,38,38,0.15);color:#dc2626;}
.ac-tag.tent{background:rgba(217,119,6,0.15);color:#d97706;}
.ac-tag.addl{background:rgba(99,102,241,0.12);color:var(--acc);}
.ac-pax{font-size:10px;opacity:.88;margin-left:auto;}

/* summary bar */
.sum-bar{display:flex;align-items:center;gap:14px;padding:6px 14px;border-top:1px solid var(--inner-bdr);font-size:11px;color:var(--t3);flex-wrap:wrap;}
.search-bar{display:flex;align-items:center;gap:8px;padding:8px 14px;border-bottom:1px solid var(--inner-bdr);flex-wrap:wrap;}
.search-input-wrap{position:relative;flex:1;min-width:180px;max-width:340px;}
.search-input-wrap i{position:absolute;left:9px;top:50%;transform:translateY(-50%);font-size:13px;color:var(--t3);}
.search-input{width:100%;padding:6px 10px 6px 28px;border-radius:7px;border:1px solid var(--input-bdr);background:var(--input-bg);color:var(--t1);font-size:11px;}
.range-picker{display:flex;align-items:center;gap:5px;flex-shrink:0;}
.range-input{height:28px;padding:0 6px;border-radius:7px;border:1px solid var(--input-bdr);background:var(--input-bg);color:var(--t1);font-size:11px;font-family:inherit;}
.search-input:focus{outline:none;border-color:var(--acc);}
.chip{padding:4px 10px;border-radius:14px;font-size:10px;font-weight:500;border:1px solid var(--input-bdr);background:var(--btn-bg);color:var(--t2);cursor:pointer;user-select:none;white-space:nowrap;}
.chip.active{background:var(--acc);border-color:var(--acc);color:var(--on-acc,#fff);}
.search-clear{cursor:pointer;color:var(--t3);font-size:11px;padding:4px 8px;}
.search-clear:hover{color:var(--t1);}
.legend{display:flex;align-items:center;gap:10px;margin-left:auto;font-size:10px;color:var(--t3);flex-wrap:wrap;}
.legend-item{display:flex;align-items:center;gap:3px;white-space:nowrap;}
.legend-swatch{width:8px;height:8px;border-radius:2px;flex-shrink:0;}
.legend-dash{width:12px;height:0;border-top:1.5px dashed var(--t3);flex-shrink:0;}
.sum-n{font-weight:700;color:var(--t1);}

[data-theme$="-dark"]{color-scheme:dark;--ok:#4ade80;--risk:#fbbf24;--gap:#f87171;--unk:#a8b0bd;--ok-bg:rgba(74,222,128,.14);--risk-bg:rgba(251,191,36,.14);--gap-bg:rgba(248,113,113,.15);--unk-bg:rgba(168,176,189,.14);}

/* ═══════════ GENERAL / ACCESSIBILITY ═══════════ */
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;}
button{font-family:inherit;}
.lbl{display:none;}
.no-icons .lbl{display:inline;}
.no-icons i.ti{display:none;}
.btn.icon-only{padding:0 9px;}
.refresh-pulse{display:inline-block;width:6px;height:6px;border-radius:50%;background:#10b981;animation:pulse 2s ease-in-out infinite;}
.stale-dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--risk);}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1);}50%{opacity:.5;transform:scale(.8);}}
.range-hint{font-size:11px;color:var(--gap);padding:2px 6px;white-space:nowrap;}
.range-banner{display:flex;align-items:center;gap:10px;padding:7px 14px;font-size:12px;color:var(--t2);background:var(--acc-bg);border-bottom:1px solid var(--acc-bdr);flex-wrap:wrap;}
.range-banner.warn{background:var(--risk-bg);border-bottom-color:var(--risk);}
.range-banner .rb-msg{flex:1;min-width:160px;}
.range-banner .btn{height:26px;padding:0 10px;}
.tab-bdg{font-size:10px;}
.sc-tab{background:none;border-top:0;border-left:0;border-right:0;font-family:inherit;}
.ac{min-width:0;}
.ac.other{background:var(--acc-bg2);border:1px solid var(--inner-bdr);border-left:3px solid var(--t3);color:var(--t2);}
.ac-tag{font-size:10px;}
.ac-more{background:var(--acc-bg);border:1px dashed var(--acc-bdr);color:var(--acc);font-family:inherit;cursor:pointer;}
button.search-clear{background:none;border:0;font-family:inherit;}

/* visa glyph dots — shape + colour, never colour alone */
.vdot{display:inline-flex;align-items:center;justify-content:center;width:14px;height:14px;border-radius:50%;font-size:10px;font-weight:800;line-height:1;color:#fff;flex-shrink:0;}
.v-ok{background:#15803d;}.v-ok::before{content:"\2713";}
.v-risk{background:#b45309;}.v-risk::before{content:"!";}
.v-gap{background:#b91c1c;}.v-gap::before{content:"\2715";}
.v-unk{background:#4b5563;}.v-unk::before{content:"?";}
.legend-item .vdot{margin-right:2px;}

/* board layout */
#board-scroll-wrap{overflow-x:auto;}
.hint-bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;margin-top:10px;}
.hint-bar .btn{height:28px;font-size:12px;}
.undated{margin:8px 14px 12px;border:1px dashed var(--sep-c);border-radius:10px;padding:8px 10px;font-size:12px;color:var(--t2);}
.undated summary{cursor:pointer;font-weight:600;color:var(--t1);}
.undated ul{list-style:none;margin-top:6px;display:flex;flex-direction:column;gap:4px;}
.undated li button{all:unset;cursor:pointer;color:var(--acc);}
.undated li button:hover{text-decoration:underline;}
.undated li button:focus-visible{outline:2px solid var(--acc);outline-offset:2px;}

/* toast */
.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,12px);background:var(--t1);color:var(--surf-bg);padding:8px 14px;border-radius:10px;font-size:12px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;z-index:9900;max-width:90vw;}
.toast.show{opacity:1;transform:translate(-50%,0);}

/* ═══════════ DRILL-DOWN PANEL (redesigned) ═══════════ */
.sc-panel-backdrop{position:fixed;inset:0;background:var(--overlay-bg);z-index:9500;opacity:0;pointer-events:none;transition:opacity .2s;}
.sc-panel-backdrop.open{opacity:1;pointer-events:auto;display:block;}
.sc-panel{position:fixed;top:0;right:0;bottom:0;width:min(480px,100vw);background:var(--overlay-surf);border-left:1px solid var(--overlay-bdr);box-shadow:var(--overlay-shadow);z-index:9600;display:flex;flex-direction:column;transform:translateX(104%);visibility:hidden;transition:transform .26s cubic-bezier(.2,.8,.2,1),visibility 0s .26s;border-radius:0;height:auto;}
.sc-panel.open{transform:none;visibility:visible;transition:transform .26s cubic-bezier(.2,.8,.2,1),visibility 0s;}
[data-theme^="tundra"] .sc-panel{border-radius:20px 0 0 20px;}
.pn-hdr{padding:14px 18px 14px;border-bottom:1px solid var(--inner-bdr);display:flex;flex-direction:column;gap:10px;flex-shrink:0;}
.pn-top{display:flex;align-items:center;gap:8px;}
.pn-eyebrow{display:flex;gap:6px;flex-wrap:wrap;flex:1;min-width:0;align-items:center;}
.pn-nav{display:flex;align-items:center;gap:4px;}
.pn-count{font-size:11px;color:var(--t2);min-width:44px;text-align:center;}
.pn-iconbtn{width:32px;height:32px;border-radius:9px;border:1px solid var(--btn-bdr);background:var(--btn-bg);color:var(--btn-t);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;font-size:14px;flex-shrink:0;}
.pn-iconbtn:hover:not(:disabled){border-color:var(--acc-bdr);background:var(--acc-bg);}
.pn-iconbtn:disabled{opacity:.35;cursor:not-allowed;}
.pn-title{font-size:19px;font-weight:700;line-height:1.25;color:var(--t1);overflow-wrap:anywhere;font-family:var(--ttl-font,inherit);letter-spacing:-.2px;}
.pn-sub{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--t2);flex-wrap:wrap;}
.pn-chipbtn{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:7px;border:1px solid var(--inner-bdr);font-size:11px;color:var(--t2);}
.pn-chipbtn:hover{border-color:var(--acc-bdr);color:var(--acc);}
.pn-chipbtn:focus-visible{outline:2px solid var(--acc);outline-offset:2px;}
.pn-body{flex:1;overflow-y:auto;padding:16px 18px 22px;display:flex;flex-direction:column;gap:20px;overscroll-behavior:contain;}
.pn-ftr{padding:12px 18px;border-top:1px solid var(--inner-bdr);display:flex;gap:8px;flex-wrap:wrap;flex-shrink:0;padding-bottom:max(12px,env(safe-area-inset-bottom));}
.pn-ftr:empty{display:none;}

/* date ribbon: the panel's signature element */
.pn-when{display:flex;flex-direction:column;gap:10px;}
.pn-when-main{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;}
.pn-dates{font-size:26px;font-weight:800;letter-spacing:-.6px;color:var(--t1);line-height:1.1;font-family:var(--ttl-font,inherit);}
.pn-dur{font-size:12px;color:var(--t2);}
.pn-ribbon{display:flex;gap:3px;align-items:flex-end;height:22px;}
.pn-ribbon i{flex:1;min-width:3px;max-width:26px;border-radius:3px;background:var(--acc-bg);border:1px solid var(--acc-bdr);height:14px;display:block;}
.pn-ribbon i.past{background:var(--acc);border-color:var(--acc);}
.pn-ribbon i.today{background:var(--acc);border-color:var(--acc);height:22px;box-shadow:0 0 0 2px var(--acc-bg);}
.pn-ribbon i.wk{opacity:.55;height:10px;}
.pn-ribbon i.today.wk{height:22px;opacity:1;}
.pn-bar{height:8px;border-radius:5px;background:var(--acc-bg);border:1px solid var(--acc-bdr);overflow:hidden;}
.pn-bar span{display:block;height:100%;background:var(--acc);}
.pn-ribbon-lbl{display:flex;justify-content:space-between;font-size:11px;color:var(--t2);}

.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:11px;font-weight:600;border:1px solid transparent;white-space:nowrap;line-height:1.5;}
.p-ok{color:var(--ok);background:var(--ok-bg);border-color:var(--ok);}
.p-risk{color:var(--risk);background:var(--risk-bg);border-color:var(--risk);}
.p-gap{color:var(--gap);background:var(--gap-bg);border-color:var(--gap);}
.p-unk{color:var(--unk);background:var(--unk-bg);border-color:var(--unk);}
.p-info{color:var(--acc);background:var(--acc-bg);border-color:var(--acc-bdr);}
.p-mode{border-color:currentColor;}
.p-mode.ilt{background:var(--mode-ilt-bg);color:var(--mode-ilt-t);border-color:var(--mode-ilt-bd);}
.p-mode.ilo{background:var(--mode-ilo-bg);color:var(--mode-ilo-t);border-color:var(--mode-ilo-bd);}
.p-mode.fmat{background:var(--mode-fmat-bg);color:var(--mode-fmat-t);border-color:var(--mode-fmat-bd);}
.p-mode.oth{background:var(--acc-bg2);color:var(--t2);border-color:var(--t3);}
.p-mode.un{background:var(--risk-bg);color:var(--risk);border-color:var(--risk);}

.pn-sec{display:flex;flex-direction:column;gap:10px;}
.pn-sec-h{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:13px;font-weight:700;color:var(--t1);}
.pn-sec-h small{font-size:11px;font-weight:500;color:var(--t2);}
.pn-facts{display:grid;grid-template-columns:104px 1fr;gap:9px 12px;font-size:13px;}
.pn-facts dt{color:var(--t2);font-size:12px;padding-top:1px;}
.pn-facts dd{color:var(--t1);overflow-wrap:anywhere;min-width:0;}
.pn-note{font-size:12px;color:var(--t2);line-height:1.5;}
.pn-pre{white-space:pre-wrap;font-size:13px;line-height:1.55;color:var(--t1);background:var(--acc-bg2);border:1px solid var(--inner-bdr);border-radius:10px;padding:10px 12px;overflow-wrap:anywhere;}

.pn-trainer{border:1px solid var(--inner-bdr);border-radius:12px;background:var(--surf-bg);overflow:hidden;}
.pn-tr-head{display:flex;align-items:center;gap:10px;padding:10px 12px;}
.pn-av{width:32px;height:32px;border-radius:50%;background:var(--acc-bg);color:var(--acc);font-weight:700;font-size:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.pn-tr-id{flex:1;min-width:0;}
.pn-tr-name{font-size:13px;font-weight:600;color:var(--t1);overflow-wrap:anywhere;}
.pn-tr-mail{font-size:12px;color:var(--t2);overflow-wrap:anywhere;}
.pn-tr-mail a{color:inherit;}
.pn-tr-note{padding:0 12px 10px 54px;font-size:12px;color:var(--t2);line-height:1.45;}
.pn-trainer details{border-top:1px solid var(--inner-bdr);}
.pn-trainer summary{cursor:pointer;padding:8px 12px;font-size:12px;color:var(--t2);list-style:none;display:flex;align-items:center;gap:6px;}
.pn-trainer summary::-webkit-details-marker{display:none;}
.pn-trainer summary::before{content:"\25B8";font-size:10px;transition:transform .15s;}
.pn-trainer details[open] summary::before{transform:rotate(90deg);}
.pn-trainer summary:hover{color:var(--t1);}
.pn-vl{padding:0 12px 10px;display:flex;flex-direction:column;gap:6px;}
.pn-vrow{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--t1);}
.pn-vrow .c{flex:1;min-width:0;overflow-wrap:anywhere;}
.pn-vrow.dest .c{font-weight:700;}
.pn-vrow .d{color:var(--t2);font-size:11px;white-space:nowrap;}
.pn-vgroup{font-size:11px;color:var(--t2);padding-top:4px;}
.pn-vrow a{color:var(--acc);}

.sc-link{color:var(--acc);text-decoration:none;font-size:inherit;background:none;border:0;cursor:pointer;font-family:inherit;padding:0;}
.sc-link:hover{text-decoration:underline;}
.sc-badge{display:inline-block;padding:2px 7px;border-radius:5px;font-size:11px;font-weight:600;}

.sk{height:12px;border-radius:6px;background:linear-gradient(90deg,var(--inner-bdr),var(--acc-bg),var(--inner-bdr));background-size:200% 100%;animation:skl 1.3s linear infinite;}
@keyframes skl{from{background-position:200% 0}to{background-position:-200% 0}}
.sk-stack{display:flex;flex-direction:column;gap:8px;}
.pn-err{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--gap);flex-wrap:wrap;}
.pn-err .btn{height:26px;padding:0 10px;}
.pn-empty{font-size:12px;color:var(--t2);}

.pn-hit{border:1px solid var(--inner-bdr);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;background:var(--surf-bg);}
.pn-hit h4{font-size:13px;color:var(--t1);}
.pn-verdict{border-radius:12px;padding:12px 14px;font-size:13px;line-height:1.55;border:1px solid var(--inner-bdr);background:var(--acc-bg2);color:var(--t1);}
.pn-verdict.bad{border-color:var(--gap);background:var(--gap-bg);}
.pn-verdict.good{border-color:var(--ok);background:var(--ok-bg);}
.pn-verdict p+p{margin-top:8px;}
.pn-kbd-row{display:flex;justify-content:space-between;gap:12px;font-size:13px;padding:6px 0;border-bottom:1px solid var(--inner-bdr);}
kbd{font-family:inherit;font-size:11px;font-weight:600;border:1px solid var(--btn-bdr);border-bottom-width:2px;border-radius:6px;padding:1px 6px;background:var(--btn-bg);color:var(--btn-t);}

/* ═══════════ MODAL (connect / settings) ═══════════ */
.sc-modal-wrap{position:fixed;inset:0;z-index:9800;display:none;align-items:center;justify-content:center;background:var(--modal-bg);padding:16px;}
.sc-modal-wrap.open{display:flex;}
.sc-modal{width:min(540px,100%);max-height:92vh;overflow:auto;border-radius:16px;border:1px solid var(--overlay-bdr);background:var(--overlay-surf);box-shadow:var(--overlay-shadow);padding:20px 22px;display:flex;flex-direction:column;gap:14px;}
.sc-modal h2{font-size:18px;color:var(--t1);font-family:var(--ttl-font,inherit);}
.sc-modal p{font-size:13px;color:var(--t2);line-height:1.5;}
.fld{display:flex;flex-direction:column;gap:5px;}
.fld label{font-size:12px;font-weight:600;color:var(--t1);}
.fld small{font-size:11px;color:var(--t2);line-height:1.4;}
.fld input[type=text],.fld input[type=password],.fld textarea{width:100%;padding:8px 10px;border-radius:8px;border:1px solid var(--input-bdr);background:var(--input-bg);color:var(--t1);font-size:13px;font-family:inherit;}
.fld textarea{min-height:76px;resize:vertical;}
.fld input:focus,.fld textarea:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 2px var(--acc-bg);}
.chk{display:flex;gap:8px;align-items:flex-start;font-size:12px;color:var(--t2);}
.modal-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;margin-top:4px;}
.btn.primary{background:var(--acc);color:var(--on-acc,#fff);border-color:var(--acc);}
.btn.danger{color:var(--gap);border-color:var(--gap);}
.modal-err{font-size:12px;color:var(--gap);}

/* ═══════════ RESPONSIVE ═══════════ */
@media (max-width:1100px){
  .toolbar{flex-wrap:wrap;row-gap:8px;}
  .toolbar .sep{display:none;}
  .toolbar>div[style*="margin-left:auto"]{margin-left:0!important;}
  .legend{margin-left:0;width:100%;}
}
@media (max-width:760px){
  .panel{padding:10px 8px;}
  .range-picker{width:100%;}
  .range-input{flex:1;min-width:0;}
  .search-input-wrap{max-width:none;}
  .sc-panel{width:100vw;}
  .pn-dates{font-size:22px;}
  .pn-facts{grid-template-columns:92px 1fr;}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important;}
}
.p-live{color:var(--on-acc,#fff);background:var(--acc);border-color:var(--acc);}
.pn-vrow .d.ok{color:var(--ok);}

.toolbar{flex-wrap:wrap;row-gap:6px;}
.lst{white-space:normal;flex:1 1 220px;min-width:0;max-width:100%;}
a.btn{text-decoration:none;}
.sc-panel{backdrop-filter:blur(18px) saturate(1.1);-webkit-backdrop-filter:blur(18px) saturate(1.1);}
.pn-more{border:1px dashed var(--sep-c);border-radius:12px;padding:0;}
.pn-more>summary{cursor:pointer;padding:9px 12px;font-size:12px;color:var(--acc);font-weight:600;list-style:none;}
.pn-more>summary::-webkit-details-marker{display:none;}
.pn-more[open]>summary{border-bottom:1px dashed var(--sep-c);}
.pn-more-body{display:flex;flex-direction:column;gap:8px;padding:8px;}

/* phones: tabs scroll, legend wraps — the page itself must never scroll sideways */
.panel{min-width:0;}
.tabs-bar{overflow-x:auto;scrollbar-width:thin;}
.sc-tab{flex-shrink:0;}
#legend-visa{flex-wrap:wrap;white-space:normal;row-gap:4px;}
.legend{min-width:0;}

/* calendar: the board scrolls inside its own frame, so the day header, toolbar, tabs,
   search and summary bar all stay in view while you scroll through a busy week */
#board-scroll-wrap{overflow:auto;position:relative;overscroll-behavior:contain;min-height:240px;}
.wk-hdr{position:sticky;top:0;z-index:6;background-color:var(--overlay-surf);box-shadow:0 1px 0 var(--inner-bdr);}

/* header cells must be fully opaque or cards show through as they scroll underneath */
.wk-hdr .wk-day{background-color:var(--overlay-surf);background-image:linear-gradient(var(--surf-bg),var(--surf-bg));}
.wk-hdr .wk-day.weekend{background-image:linear-gradient(var(--wknd-bg),var(--wknd-bg));}
.wk-hdr .wk-day.today{background-image:linear-gradient(var(--today-bg),var(--today-bg));}

/* ═══════════ LIST VIEW ═══════════ */
.view-cal-only{display:none;}
.view-list .cal-only{display:none!important;}
.view-toggle{display:inline-flex;border:1px solid var(--btn-bdr);border-radius:9px;overflow:hidden;flex-shrink:0;}
.view-toggle button{border:0;background:var(--btn-bg);color:var(--btn-t);padding:0 13px;height:30px;font-size:12px;font-weight:600;cursor:pointer;}
.view-toggle button+button{border-left:1px solid var(--btn-bdr);}
.view-toggle button[aria-pressed="true"]{background:var(--acc);color:var(--on-acc,#fff);}
.list-bar{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;padding:8px 14px;border-bottom:1px solid var(--inner-bdr);font-size:12px;color:var(--t2);}
.list-bar label{display:inline-flex;align-items:center;gap:6px;}
.list-bar select{height:28px;border-radius:8px;border:1px solid var(--input-bdr);background:var(--input-bg);color:var(--t1);font-size:12px;padding:0 8px;font-family:inherit;}
.list-bar .btn{height:28px;padding:0 10px;}
#list-wrap{overflow:auto;position:relative;overscroll-behavior:contain;min-height:240px;}
.lt{width:100%;min-width:960px;border-collapse:separate;border-spacing:0;font-size:13px;color:var(--t1);}
.lt th{position:sticky;top:0;z-index:3;background-color:var(--overlay-surf);text-align:left;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--t2);padding:0;border-bottom:1px solid var(--sep-c);white-space:nowrap;}
.lt-sort{all:unset;box-sizing:border-box;cursor:pointer;display:block;width:100%;padding:10px 12px;}
.lt-sort:hover{color:var(--t1);}
.lt-sort:focus-visible{outline:2px solid var(--acc);outline-offset:-2px;}
.lt td{padding:10px 12px;vertical-align:top;border-bottom:1px solid var(--inner-bdr);}
.lt tr.lrow{cursor:pointer;}
.lt tr.lrow:hover td{background:var(--acc-bg2);}
.lt .sub{font-size:11px;color:var(--t2);margin-top:2px;}
.lt .nowrap{white-space:nowrap;}
.lt-open{all:unset;cursor:pointer;font-weight:600;color:var(--t1);overflow-wrap:anywhere;}
.lt-open:hover{text-decoration:underline;}
.lt-open:focus-visible{outline:2px solid var(--acc);outline-offset:2px;}
.lt-trainers{display:flex;flex-direction:column;gap:2px;}

function extraDMs(){
  try{
    var o=JSON.parse(localStorage.getItem('scouter_extra_dms')||'[]');
    return Array.isArray(o)?o.filter(function(d){return d&&d.email;}):[];

// ── SMALL HELPERS ─────────────────────────────────────────────────────────────
function $(id){return document.getElementById(id);}
function es(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}
function safeUrl(u){return !!u&&/^https?:\/\//i.test(String(u).trim());}
function toPax(v){
  if(v==null||v==='')return null;
  var n=Number(v);
  return (isFinite(n)&&n>=0)?n:null;          // 0 stays 0; junk becomes "unknown", not 1
}
function paxTxt(p){return p==null?'pax ?':p+' pax';}
function hash36(s){var h=5381;s=String(s);for(var i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;return (h>>>0).toString(36);}
function initials(n){var p=String(n||'').trim().split(/\s+/);return ((p[0]||'')[0]||'?').toUpperCase()+((p.length>1?p[p.length-1][0]:'')||'').toUpperCase();}
var _toastT=null;
function toast(msg){
  var t=$('toast');if(!t)return;
  t.textContent=msg;t.classList.add('show');
  clearTimeout(_toastT);_toastT=setTimeout(function(){t.classList.remove('show');},1800);
}
function copyText(text,okMsg){
  function fallback(){
    try{
      var ta=document.createElement('textarea');ta.value=text;ta.setAttribute('readonly','');
      ta.style.cssText='position:fixed;opacity:0;top:0;left:0';document.body.appendChild(ta);ta.select();
      var ok=document.execCommand('copy');document.body.removeChild(ta);
      toast(ok?(okMsg||'Copied'):'Could not copy');
    }catch(e){toast('Could not copy');}
  }
  if(navigator.clipboard&&window.isSecureContext){
    navigator.clipboard.writeText(text).then(function(){toast(okMsg||'Copied');},fallback);
  }else fallback();
}

// ── CREDENTIALS ───────────────────────────────────────────────────────────────
var CREDS={at:'',dt:'',sc:''};
function loadCreds(){
  try{
    var raw=sessionStorage.getItem('scouter_creds')||localStorage.getItem('scouter_creds_saved');
    if(raw){var o=JSON.parse(raw);if(o&&o.at&&o.dt){CREDS={at:o.at,dt:o.dt,sc:o.sc||''};return true;}}
  }catch(e){}
  var d=CONFIG.DEFAULT_CREDS;
  if(d&&d.at&&d.dt){CREDS={at:d.at,dt:d.dt,sc:d.sc||''};return true;}
  return false;
}
function saveCreds(c,remember){
  CREDS={at:c.at,dt:c.dt,sc:c.sc||''};
  try{sessionStorage.setItem('scouter_creds',JSON.stringify(CREDS));}catch(e){}
  try{
    if(remember)localStorage.setItem('scouter_creds_saved',JSON.stringify(CREDS));
    else localStorage.removeItem('scouter_creds_saved');
  }catch(e){}
}
function clearCreds(){
  CREDS={at:'',dt:'',sc:''};
  try{sessionStorage.removeItem('scouter_creds');}catch(e){}
  try{localStorage.removeItem('scouter_creds_saved');}catch(e){}
}
function hasCreds(){return !!(CREDS.at&&CREDS.dt);}
function aUrl(k){return CONFIG.API+'?apikey='+encodeURIComponent(k)+'&accessToken='+encodeURIComponent(CREDS.at)+'&deviceToken='+encodeURIComponent(CREDS.dt);}

// ── API CLIENT ────────────────────────────────────────────────────────────────
function abortErr(){var e=new Error('aborted');e.name='AbortError';return e;}
function isAbort(e){return !!e&&(e.name==='AbortError'||e.message==='aborted');}
function delay(ms,signal){
  return new Promise(function(res,rej){
    var t=setTimeout(res,ms);
    if(signal)signal.addEventListener('abort',function(){clearTimeout(t);rej(abortErr());},{once:true});
  });
}
// A 200 response can still carry an error. Detect the common shapes rather than
// reading them as "no rows" (which is how an expired token used to look like an empty board).
function payloadError(j){
  if(!j||typeof j!=='object'||Array.isArray(j))return null;
  var bad=j.success===false||j.Success===false||j.isSuccess===false||j.IsSuccess===false||
    !!j.error||!!j.Error||(Array.isArray(j.errors)&&j.errors.length>0)||
    (typeof j.statusCode==='number'&&j.statusCode>=400)||(typeof j.status==='number'&&j.status>=400)||
    (typeof j.status==='string'&&/^(error|fail|unauthori[sz]ed|forbidden)/i.test(j.status));
  if(!bad)return null;
  var msg=j.message||j.Message||(typeof j.error==='string'?j.error:'')||(typeof j.Error==='string'?j.Error:'')||'The API reported an error';
  var e=new Error(String(msg));
  if(/unauthori|forbidden|token|credential|expired|denied/i.test(String(msg))||j.statusCode===401||j.statusCode===403||j.status===401||j.status===403){e.auth=true;e.name='AuthError';}
  return e;
}
function parsePayload(j){
  if(Array.isArray(j))return j;
  var err=payloadError(j);if(err)throw err;
  if(j==null)return [];
  var c=j.content;
  if(c==null||c==='')return [];
  if(typeof c==='string'){
    try{return JSON.parse(c);}catch(e){var pe=new Error('The API returned a response Scouter could not read');pe.parse=true;throw pe;}
  }
  return c;
}
function kF(k,b,signal,o){
  var retries=(o&&o.retries!=null)?o.retries:CONFIG.RETRIES;
  var attempt=0;
  function once(){
    if(signal&&signal.aborted)return Promise.reject(abortErr());
    var ctrl=new AbortController(),timedOut=false;
    var timer=setTimeout(function(){timedOut=true;ctrl.abort();},CONFIG.TIMEOUT_MS);
    var onAbort=function(){ctrl.abort();};
    if(signal)signal.addEventListener('abort',onAbort);
    return fetch(aUrl(k),{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},body:JSON.stringify(b||{}),credentials:'omit',signal:ctrl.signal})
      .then(function(r){
        if(r.status===401||r.status===403){var ae=new Error('The API rejected the credentials (HTTP '+r.status+')');ae.name='AuthError';ae.auth=true;throw ae;}
        if(!r.ok){var he=new Error('HTTP '+r.status);he.status=r.status;throw he;}
        return r.json();
      })
      .then(parsePayload)
      .catch(function(e){
        if(timedOut&&isAbort(e)){var te=new Error('Request timed out');te.timeout=true;throw te;}
        throw e;
      })
      .then(function(v){clearTimeout(timer);if(signal)signal.removeEventListener('abort',onAbort);return v;},
            function(e){clearTimeout(timer);if(signal)signal.removeEventListener('abort',onAbort);throw e;});
  }
  function run(){
    return once().catch(function(e){
      if(isAbort(e)||e.auth||e.parse||(signal&&signal.aborted))throw e;
      var retryable=e.timeout||e.status===429||e.status>=500||e.name==='TypeError';
      if(retryable&&attempt<retries){
        attempt++;
        return delay(600*Math.pow(2,attempt-1)+Math.random()*250,signal).then(run);
      }
      throw e;
    });
  }
  return run();
}
// Bounded worker pool: one slow request no longer holds up a whole wave of ten.
function runPool(items,limit,worker,signal){
  return new Promise(function(resolve,reject){
    var i=0,active=0,done=0,dead=false;
    if(!items.length){resolve();return;}
    function pump(){
      if(dead)return;
      if(signal&&signal.aborted){dead=true;reject(abortErr());return;}
      while(active<limit&&i<items.length){
        (function(item){
          active++;
          Promise.resolve().then(function(){return worker(item);}).then(function(){
            active--;done++;
            if(done===items.length)resolve();else pump();
          },function(e){if(!dead){dead=true;reject(e);}});
        })(items[i++]);
      }
    }
    pump();
  });
}

// ── PERSISTENT CACHE ──────────────────────────────────────────────────────────
// v2 differences: keyed per credential, never stores visa records (personal data),
// and is written only after a clean sync so a failed run can't be served for 24 h.
function cacheKey(){return 'scouter_cache_v2_'+hash36(CREDS.at);}
function syncIsClean(){
  if(_stats.rosterError||_stats.failedDMs.length)return false;
  return !Object.keys(_quarters).some(function(k){return _quarters[k].status!=='ok';});
}
function cacheSave(){
  if(!syncIsClean())return false;
  try{
    var q={};Object.keys(_quarters).forEach(function(k){q[k]={ts:_quarters[k].ts,dropped:_quarters[k].dropped||0};});
    var payload={v:2,ts:Date.now(),
      trainers:_allTrainers,
      quarters:q,
      assigns:Object.keys(_assignCache).map(function(id){
        var a=_assignCache[id];
        return{i:a.assignId,c:a.course,m:a.mode,v:a.vendor,l:a.location,s:toISO(a.sDate),e:toISO(a.eDate),
          st:a.startTime,et:a.endTime,p:a.pax,
          t:a.trainers.map(function(t){return{n:t.name,e:t.email,s:t.sDate?toISO(t.sDate):'',d:t.eDate?toISO(t.eDate):''};})};
      })};
    localStorage.setItem(cacheKey(),JSON.stringify(payload));
    return true;
  }catch(e){console.warn('[cache] save failed —',e&&e.message);return false;}
}
function cacheLoad(){
  try{
    var raw=localStorage.getItem(cacheKey());
    if(!raw)return false;
    var p=JSON.parse(raw);
    if(!p||p.v!==2||!p.ts||(Date.now()-p.ts)>CONFIG.CACHE_TTL){localStorage.removeItem(cacheKey());return false;}
    if(!Array.isArray(p.trainers)||!p.trainers.length||!p.quarters||!Object.keys(p.quarters).length)return false;
    _allTrainers=p.trainers;
    Object.keys(p.quarters).forEach(function(k){_quarters[k]={status:'ok',failed:[],dropped:p.quarters[k].dropped||0,droppedIds:[],ts:p.quarters[k].ts};});
    (p.assigns||[]).forEach(function(a){
      var sd=parseDate(a.s),ed=parseDate(a.e);
      if(!sd||!ed)return;
      var tr=(a.t||[]).map(function(t){return{name:t.n,email:t.e,sDate:parseDate(t.s)||sd,eDate:parseDate(t.d)||ed};});
      var rec={assignId:a.i,course:a.c,mode:a.m,vendor:a.v,location:a.l,sDate:sd,eDate:ed,startTime:a.st,endTime:a.et,pax:a.p==null?null:toPax(a.p),trainers:tr};
      finalizeAssignment(rec);
      _assignCache[a.i]=rec;
    });
    _cacheAgeMs=Date.now()-p.ts;
    return true;
  }catch(e){console.warn('[cache] load failed —',e&&e.message);return false;}
}

var DAYS=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
var MONTHS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
var MON={jan:0,feb:1,mar:2,apr:3,may:4,jun:5,jul:6,aug:7,sep:8,oct:9,nov:10,dec:11};
function pad(n){return n<10?'0'+n:String(n);}
function toISO(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function mkDate(y,m,d){
  var dt=new Date(y,m,d);
  return (dt.getFullYear()===y&&dt.getMonth()===m&&dt.getDate()===d)?dt:null;   // rejects 31 Feb, month 13, undefined
}
// Returns a valid local-midnight Date or null — never an Invalid Date.
function parseDate(s){
  if(s instanceof Date)return isNaN(s.getTime())?null:s;
  if(s==null)return null;
  s=String(s).trim();if(!s)return null;
  var m;
  if((m=s.match(/^(\d{4})-(\d{2})-(\d{2})(?:$|[T\s])/)))return mkDate(+m[1],+m[2]-1,+m[3]);
  if((m=s.match(/^(\d{1,2})[-\s\/]([A-Za-z]{3})[A-Za-z]*[-\s\/,]*(\d{4})/))){
    var mo=MON[m[2].toLowerCase()];
    return mo==null?null:mkDate(+m[3],mo,+m[1]);
  }
  if((m=s.match(/^(\d{1,2})[-\/\.](\d{1,2})[-\/\.](\d{4})/)))return mkDate(+m[3],+m[2]-1,+m[1]);   // day first
  return null;
}
function getMondayOf(d){var day=d.getDay();var diff=(day===0)?-6:1-day;var m=new Date(d);m.setDate(d.getDate()+diff);m.setHours(0,0,0,0);return m;}
function addDays(d,n){var r=new Date(d);r.setDate(r.getDate()+n);return r;}
function daysBetween(a,b){return Math.round((b-a)/86400000);}
function sameDay(a,b){return a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth()&&a.getDate()===b.getDate();}
function startOfToday(){var t=new Date();t.setHours(0,0,0,0);return t;}
// Years are always available: a board that crosses New Year must not be ambiguous.
function formatDisplay(d,withYear){return DAYS[(d.getDay()+6)%7]+' '+d.getDate()+' '+MONTHS[d.getMonth()]+(withYear?' '+d.getFullYear():'');}
function fmtDay(d){return d.getDate()+' '+MONTHS[d.getMonth()]+(d.getFullYear()!==new Date().getFullYear()?' '+d.getFullYear():'');}
function fmtRange(a,b){
  var y=new Date().getFullYear();
  if(sameDay(a,b))return fmtDay(a);
  if(a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth()){
    return a.getDate()+' – '+b.getDate()+' '+MONTHS[b.getMonth()]+(b.getFullYear()!==y?' '+b.getFullYear():'');
  }
  return fmtDay(a)+' – '+fmtDay(b);
}
function getQuarter(d){
  var q=Math.floor(d.getMonth()/3);
  return{start:new Date(d.getFullYear(),q*3,1),end:new Date(d.getFullYear(),q*3+3,0),key:d.getFullYear()+'-Q'+(q+1)};
}
function quarterFromKey(k){var p=k.split('-Q');return getQuarter(new Date(parseInt(p[0],10),(parseInt(p[1],10)-1)*3,1));}
// Step from the QUARTER start, not the range's month start, or a week straddling 30 Sep skips Q4.
function quartersSpanning(start,end){
  var out=[],d=getQuarter(start).start;
  while(d<=end){
    var q=getQuarter(d);
    if(!out.some(function(x){return x.key===q.key;}))out.push(q);
    d=new Date(d.getFullYear(),d.getMonth()+3,1);
  }
  if(!out.length)out.push(getQuarter(start));
  return out;
}
function missingQuarters(start,end){return quartersSpanning(start,end).filter(function(q){return !_quarters[q.key];});}
function clockTime(d){var h=d.getHours(),m=pad(d.getMinutes());var ap=h>=12?'pm':'am';var h12=h%12;if(h12===0)h12=12;return h12+':'+m+' '+ap;}
function ageText(ms){var m=Math.round(ms/60000);if(m<1)return 'just now';if(m<60)return m+' min ago';var h=Math.round(m/60);return h+' h ago';}

    if(_visaCountrySet[k])return k;
  }
  return '';
}
function isSchengenCountry(c){return SCHENGEN_COUNTRIES.some(function(x){return normText(x)===c;});}
function countryDisplay(c){return String(c).replace(/\b\w/g,function(m){return m.toUpperCase();});}

// User-defined mappings from Settings ("Pune = India"); they override everything below.
var _locMap={};
function loadLocMap(){try{_locMap=JSON.parse(localStorage.getItem('scouter_loc_map')||'{}')||{};}catch(e){_locMap={};}}
function locParts(location){
  return stripAccents(location).split(/[,;\u00b7|\/()]|\s[-\u2013\u2014]\s/).map(normText).filter(Boolean);
}
function cityLookup(part){
  if(CITY_COUNTRY[part])return CITY_COUNTRY[part];
  var w=part.split(' ');
  if(w.length<2)return '';
  for(var n=w.length-1;n>=1;n--){                       // "dubai marina", "frankfurt am main"
    var pre=w.slice(0,n).join(' ');if(pre.length>=4&&CITY_COUNTRY[pre])return CITY_COUNTRY[pre];
  }
  for(var m=w.length-1;m>=1;m--){                       // "greater noida"
    var suf=w.slice(w.length-m).join(' ');if(suf.length>=4&&CITY_COUNTRY[suf])return CITY_COUNTRY[suf];
  }
  return '';
}
// Order of trust: your own mapping > an explicit country name > a state/province >
// a known city > an unambiguous ISO code. Anything else stays unrecognised (and is flagged).
function countryOf(location){
  if(!location)return '';
  var whole=normText(location),parts=locParts(location),i,c;
  if(_locMap[whole])return _locMap[whole];
  for(i=parts.length-1;i>=0;i--)if(_locMap[parts[i]])return _locMap[parts[i]];
  c=canonCountry(location);if(c)return c;
  for(i=parts.length-1;i>=0;i--){c=canonCountry(parts[i]);if(c)return c;}
  var last=parts[parts.length-1];
  if(parts.length>1&&REGION_COUNTRY[last])return REGION_COUNTRY[last];
  var tail=whole.match(/\s([a-z]{2,3})$/);                // "Sydney NSW"
  if(tail&&REGION_COUNTRY[tail[1]]&&CITY_COUNTRY[whole.slice(0,whole.length-tail[0].length)])return REGION_COUNTRY[tail[1]];
  if(tail&&REGION_COUNTRY[tail[1]]&&!ISO2_COUNTRY[tail[1]])return REGION_COUNTRY[tail[1]];
  for(i=parts.length-1;i>=0;i--){c=cityLookup(parts[i]);if(c)return c;}
  if(parts.length>1&&ISO2_COUNTRY[last])return ISO2_COUNTRY[last];
  return '';
}
// ILT locations that could not be turned into a country, most frequent first.
function unmappedLocations(){
  var m={};
  Object.keys(_assignCache).forEach(function(id){
    var a=_assignCache[id];
    if(a.mode!=='ILT'||!a.location||!a.trainers.length)return;
    if(countryOf(a.location))return;
    var k=String(a.location).trim();m[k]=(m[k]||0)+1;
  });
  return Object.keys(m).map(function(k){return{loc:k,count:m[k]};}).sort(function(a,b){return b.count-a.count||a.loc.localeCompare(b.loc);});
}
function vkey(email){return String(email||'').toLowerCase();}
function visaIsCurrent(v,today){
  var from=parseDate(v.valid_from||''),upTo=parseDate(v.valid_up_to||'');
  if(from&&upTo)return today>=from&&today<=upTo;
  return !!v.valid;
}
function visaCountryKey(v){
  var raw=normText(v.country_name);
  return canonCountry(raw)||raw;
}
function visaMatchesDest(v,dest){
  var k=visaCountryKey(v);
  if(k===dest)return true;
  if(isSchengenCountry(dest)&&/schengen/.test(normText(v.country_name)))return true;
  // "UK Standard Visitor", "Visa - Japan": a run of 1-3 words in the name IS the destination
  var w=normText(v.country_name).split(/[\s\-\/]+/).filter(Boolean);
  for(var n=1;n<=3;n++)for(var i=0;i+n<=w.length;i++){if(canonCountry(w.slice(i,i+n).join(' '))===dest)return true;}
  return false;
}
// Does a visa cover the WHOLE delivery? Compared against the assignment dates, not today.
function visaCovers(v,s,e){
  var from=parseDate(v.valid_from||''),upTo=parseDate(v.valid_up_to||'');
  if(from&&upTo)return from<=s&&upTo>=e;
  return !!v.valid;   // no dates on record: trust the flag, we can't say more
}
function visaOverlaps(v,s,e){
  var from=parseDate(v.valid_from||''),upTo=parseDate(v.valid_up_to||'');
  return !!(from&&upTo&&from<=e&&upTo>=s);
}
// → {state:'ok'|'risk'|'gap'|'unknown'|'loading', note, until}
function evalVisa(email,dest,s,e){
  var recs=_visaCache[vkey(email)];
  if(recs===undefined){
    if(_visaErr[vkey(email)])return{state:'unknown',note:'Visa records could not be loaded'};
    return{state:_visasReady?'unknown':'loading',note:_visasReady?'No visa data for this trainer':'Visa records are still loading'};
  }
  var label=countryDisplay(dest);
  var rel=recs.filter(function(v){return visaMatchesDest(v,dest);});
  if(!rel.length)return{state:'gap',note:recs.length?('No visa on record for '+label):'No visa records on file for this trainer'};
  var cov=rel.filter(function(v){return visaCovers(v,s,e);});
  if(cov.length){
    var until=null;cov.forEach(function(v){var u=parseDate(v.valid_up_to||'');if(u&&(!until||u>until))until=u;});
    return{state:'ok',note:until?('Valid for '+label+' until '+formatDisplay(until,true)):('Valid for '+label),until:until};
  }
  var ov=rel.filter(function(v){return visaOverlaps(v,s,e);});
  if(ov.length){
    var v0=ov[0],from=parseDate(v0.valid_from||''),upTo=parseDate(v0.valid_up_to||'');
    var why=(upTo&&upTo<e)?('expires '+formatDisplay(upTo,true)+', before the course ends '+formatDisplay(e,true)):('only valid from '+formatDisplay(from,true)+', after the course starts '+formatDisplay(s,true));
    return{state:'risk',note:'Visa for '+label+' '+why};
  }
  var last=null;rel.forEach(function(v){var u=parseDate(v.valid_up_to||'');if(u&&(!last||u>last))last=u;});
  return{state:'gap',note:last?('Visa for '+label+' expired '+formatDisplay(last,true)):('No usable visa for '+label)};
}
var VISA_RANK={ok:0,loading:0,unknown:1,risk:2,gap:3};
// Full assessment for one assignment. applicable:false means no visa question arises.
function visaAssess(a){
  if(a.mode!=='ILT')return{applicable:false,reason:'Visa checks apply to ILT deliveries only'};
  if(!a.trainers.length)return{applicable:false,reason:'No trainer assigned'};
  if(!a.location)return{applicable:false,reason:'No delivery location recorded'};
  var dest=countryOf(a.location);
  if(!dest){
    return{applicable:true,state:'unknown',country:'',note:'Could not work out the destination country from \u201c'+a.location+'\u201d',
      per:a.trainers.map(function(t){return{t:t,res:{state:'unknown',note:'Destination country not recognised'}};})};
  }
  if(dest==='india')return{applicable:false,reason:'Domestic delivery \u2014 no visa needed'};
  if(CONFIG.VISA_NOT_REQUIRED.map(function(x){return x.toLowerCase();}).indexOf(dest)>=0)return{applicable:false,reason:'No visa required for '+countryDisplay(dest)};
  var per=a.trainers.map(function(t){return{t:t,res:evalVisa(t.email,dest,t.sDate||a.sDate,t.eDate||a.eDate)};});
  var worst='ok';
  per.forEach(function(p){if(VISA_RANK[p.res.state]>VISA_RANK[worst])worst=p.res.state;});
  var allLoading=per.every(function(p){return p.res.state==='loading';});
  return{applicable:true,state:allLoading?'loading':worst,country:dest,per:per};
}
function cardVisaStatus(a){
  var v=visaAssess(a);
  if(!v.applicable||v.state==='loading')return null;
  return v;
}
var VISA_LABEL={ok:'Visa covers the course',risk:'Visa only partly covers the course',gap:'No valid visa',unknown:'Visa status unknown'};

// ── ASSIGNMENT RECORDS ────────────────────────────────────────────────────────
var MODE_TABS=['ILT','ILO','FMAT'];
function normMode(m){return String(m==null?'':m).replace(/\s+/g,' ').trim().toUpperCase();}
function modeBucket(m){return MODE_TABS.indexOf(normMode(m))>=0?normMode(m):'Other';}
// Union of the trainers' dates becomes the assignment's span; per-trainer dates are kept.
function finalizeAssignment(a){
  var s=a.sDate,e=a.eDate,vary=false;
  a.trainers.forEach(function(t){
    if(!t.sDate)t.sDate=a.sDate;if(!t.eDate)t.eDate=a.eDate;
    if(t.sDate<s)s=t.sDate;if(t.eDate>e)e=t.eDate;
  });
  a.sDate=s;a.eDate=e;
  a.trainers.forEach(function(t){if(t.sDate.getTime()!==a.sDate.getTime()||t.eDate.getTime()!==a.eDate.getTime())vary=true;});
  a.datesVary=vary;
  return a;
}
function ingestRow(map,row,trainerEmail,acc){
  var id=String(row.AssignmentId||'');if(!id)return;
  // The API field is misspelt "StarDate"; fall back in case it is ever corrected.
  var sDate=parseDate(row.StarDate||row.StartDate);
  var eDate=parseDate(row.EndDate||row.Enddate);
  if(!sDate||!eDate){acc.dropped++;if(acc.droppedIds.length<50)acc.droppedIds.push(id);return;}
  var a=map[id];
  if(!a){
    a=map[id]={assignId:id,course:row.Course||'',mode:normMode(row.Mode),vendor:row.Vendor||'',location:row.Location||'',
      sDate:sDate,eDate:eDate,startTime:row.StartTime||'',endTime:row.EndTime||'',pax:toPax(row.NoOfParticipants),trainers:[]};
  }
  var tn=String(row.TrainerName||'').trim();
  var key=vkey(trainerEmail||tn);
  if(tn&&!a.trainers.some(function(x){return vkey(x.email||x.name)===key;})){
    a.trainers.push({name:tn,email:trainerEmail,sDate:sDate,eDate:eDate});
  }
}

// ── LOAD ROSTER (apikey 82) ───────────────────────────────────────────────────
function loadRoster(signal){
  var dms=currentDMs(),found={},emptyDMs=[],failedDMs=[];
  function add(name,email,dmEmail){
    var k=vkey(email);
    if(!found[k])found[k]={name:name,email:email,dms:[]};
    if(found[k].dms.indexOf(vkey(dmEmail))<0)found[k].dms.push(vkey(dmEmail));
  }
  return runPool(dms,CONFIG.CONCURRENCY,function(dm){
    return kF(82,{email:dm.email},signal).then(function(rows){
      if(!Array.isArray(rows))throw new Error('Unexpected response');
      var n=0;
      rows.forEach(function(r){
        if(r&&r.OffEmail&&r.TrainerName){var em=String(r.OffEmail).trim();if(em){add(String(r.TrainerName).trim(),em,dm.email);n++;}}
      });
      if(!n)emptyDMs.push(dm.name);
      add(dm.name,dm.email,dm.email);       // managers deliver too
    }).catch(function(e){
      if(isAbort(e)||e.auth)throw e;
      failedDMs.push({email:vkey(dm.email),name:dm.name,msg:e.message});
    });
  },signal).then(function(){return{dms:dms,found:found,emptyDMs:emptyDMs,failedDMs:failedDMs};});
}
// Replace the roster with a fresh one, but keep trainers of any manager whose call failed.
function applyRoster(res){
  var failedKeys={};res.failedDMs.forEach(function(f){failedKeys[f.email]=true;});
  var next=Object.keys(res.found).map(function(k){return res.found[k];});
  var have={};next.forEach(function(t){have[vkey(t.email)]=true;});
  _allTrainers.forEach(function(t){
    if(have[vkey(t.email)])return;
    if((t.dms||[]).some(function(d){return failedKeys[d];}))next.push(t);
  });
  _allTrainers=next;
  _stats.emptyDMs=res.emptyDMs.slice();
  _stats.failedDMs=res.failedDMs.slice();
}
// Validates a roster result. Throws if it is unusable (everything empty/failed).
function syncRoster(signal){
  _stats.rosterError='';
  return loadRoster(signal).then(function(res){
    var total=res.dms.length;
    if(res.failedDMs.length===total)throw new Error('Could not reach the API for any manager ('+res.failedDMs[0].msg+')');
    if(res.emptyDMs.length+res.failedDMs.length===total)throw new Error('The API returned no trainers for any manager \u2014 check the credentials');
    applyRoster(res);
    return res;
  }).catch(function(e){
    if(isAbort(e)||e.auth)throw e;
    if(!_allTrainers.length)throw e;           // nothing to fall back on
    _stats.rosterError=e.message;               // keep the previous roster and say so
    return null;
  });
}

// ── LOAD ASSIGNMENTS (apikey 16) ──────────────────────────────────────────────
// Fetch into a staging map; only a successful fetch is allowed to replace anything.
function fetchQuarter(q,signal,onProgress,onPartial){
  var padS=addDays(q.start,-CONFIG.FETCH_PAD_DAYS),padE=addDays(q.end,CONFIG.FETCH_PAD_DAYS);
  var trainers=_allTrainers.slice(),fresh={},failed=[],firstErr='',done=0;
  var acc={dropped:0,droppedIds:[]},partialSent=false;
  return runPool(trainers,CONFIG.CONCURRENCY,function(t){
    return kF(16,{Startdate:toISO(padS),Enddate:toISO(padE),Email:t.email},signal).then(function(rows){
      if(!Array.isArray(rows))throw new Error('Unexpected response');
      rows.forEach(function(row){ingestRow(fresh,row,t.email,acc);});
    }).catch(function(e){
      if(isAbort(e)||e.auth)throw e;
      failed.push(vkey(t.email));if(!firstErr)firstErr=e.message;
      console.warn('[16]',t.email,e.message);
    }).then(function(){
      done++;
      if(onProgress)onProgress(done,trainers.length);
      if(onPartial&&!partialSent&&done>=Math.min(20,trainers.length)){partialSent=true;onPartial(fresh);}
    });
  },signal).then(function(){
    if(trainers.length&&failed.length===trainers.length)throw new Error('every trainer request failed ('+firstErr+')');
    Object.keys(fresh).forEach(function(id){finalizeAssignment(fresh[id]);});
    return{q:q,padS:padS,padE:padE,fresh:fresh,failed:failed,acc:acc};
  });
}
function applyQuarter(res){
  var failedSet={};res.failed.forEach(function(k){failedSet[k]=true;});
  // Drop assignments that vanished upstream — unless one of their trainers' calls failed,
  // in which case we can't know and the old record is kept.
  Object.keys(_assignCache).forEach(function(id){
    if(res.fresh[id])return;
    var a=_assignCache[id];
    if(a.sDate<res.padS||a.sDate>res.padE)return;
    if(a.trainers.some(function(t){return failedSet[vkey(t.email)];}))return;
    delete _assignCache[id];
  });
  Object.keys(res.fresh).forEach(function(id){
    var nw=res.fresh[id],old=_assignCache[id];
    if(old){
      old.trainers.forEach(function(t){
        if(failedSet[vkey(t.email)]&&!nw.trainers.some(function(x){return vkey(x.email)===vkey(t.email);}))nw.trainers.push(t);
      });
      finalizeAssignment(nw);
    }
    _assignCache[id]=nw;
  });
  _quarters[res.q.key]={status:res.failed.length?'partial':'ok',failed:res.failed,dropped:res.acc.dropped,droppedIds:res.acc.droppedIds,ts:Date.now()};
  delete _quarterErr[res.q.key];
}
function loadQuarters(quarters,signal,opts){
  opts=opts||{};
  var errs=[];
  return quarters.reduce(function(chain,q){
    return chain.then(function(){
      if(_loadingQuarters[q.key])return;
      _loadingQuarters[q.key]=true;
      return fetchQuarter(q,signal,function(d,t){progressMsg('Assignments '+q.key+': '+d+'/'+t+' trainers\u2026');},opts.onPartial)
        .then(function(res){applyQuarter(res);})
        .catch(function(e){
          if(isAbort(e)||e.auth)throw e;
          _quarterErr[q.key]=e.message;errs.push(q.key+': '+e.message);
        })
        .then(function(){delete _loadingQuarters[q.key];},function(e){delete _loadingQuarters[q.key];throw e;});
    });
  },Promise.resolve()).then(function(){return errs;});
}

// ── LOAD VISAS (apikey 109) ───────────────────────────────────────────────────
// Success stores the rows (even an empty list = "none on file"). Failure stores NOTHING
// for the trainer, so "couldn't load" can never masquerade as "has no visas".
function loadVisas(signal){
  var list=_allTrainers.slice(),done=0;
  return runPool(list,CONFIG.VISA_CONCURRENCY,function(t){
    return kF(109,{email_Address:t.email},signal).then(function(rows){
      if(!Array.isArray(rows))throw new Error('Unexpected response');
      _visaCache[vkey(t.email)]=rows;delete _visaErr[vkey(t.email)];
      rows.forEach(function(r){var c=visaCountryKey(r);if(c)_visaCountrySet[c]=true;});
    }).catch(function(e){
      if(isAbort(e)||e.auth)throw e;
      _visaErr[vkey(t.email)]=e.message;
    }).then(function(){
      done++;
      if(done%25===0||done===list.length)progressMsg('Visas: '+done+'/'+list.length+'\u2026');
    });
  },signal).then(function(){_visasReady=true;});
}

// ── STATUS ────────────────────────────────────────────────────────────────────
function setSt(msg){var el=$('init-msg');if(el)el.textContent=msg;}
function progressMsg(msg){
  var bar=$('init-bar');
  if(bar&&bar.style.display!=='none')setSt(msg);else setLoadStatus(msg);
}
function hideInitBar(){var el=$('init-bar');if(el)el.style.display='none';var s=$('load-status');if(s)s.style.display='';}
function setLoadStatus(msg){
  var el=$('load-status');if(!el)return;
  el.textContent=msg;
  var tips=[];
  if(_stats.emptyDMs.length)tips.push('No trainers returned for: '+_stats.emptyDMs.join(', '));
  if(_stats.failedDMs.length)tips.push('Roster call failed for: '+_stats.failedDMs.map(function(f){return f.name;}).join(', '));
  var dr=[];Object.keys(_quarters).forEach(function(k){(_quarters[k].droppedIds||[]).forEach(function(i){dr.push(i);});});
  if(dr.length)tips.push('Skipped (bad dates), assignment IDs: '+dr.slice(0,15).join(', ')+(dr.length>15?'\u2026':''));
  el.title=tips.join('\n');
}
function statusLine(){
  var all=Object.keys(_assignCache).map(function(k){return _assignCache[k];});
  var parts=[all.length+' assignments'];
  var qs=Object.keys(_quarters).sort();
  if(qs.length)parts.push(qs.join(', ')+' loaded');
  var other=all.filter(function(a){return modeBucket(a.mode)==='Other';}).length;
  if(other)parts.push(other+' under Other');
  if(_stats.emptyDMs.length){var n=_stats.emptyDMs.length;parts.push('no trainers under '+_stats.emptyDMs.slice(0,2).join(', ')+(n>2?' +'+(n-2)+' more':''));}
  if(_stats.failedDMs.length)parts.push('roster failed for '+_stats.failedDMs.length+' manager'+(_stats.failedDMs.length!==1?'s':''));
  if(_stats.rosterError)parts.push('roster not refreshed');
  var tf=0,rd=0,pq=0;
  Object.keys(_quarters).forEach(function(k){var q=_quarters[k];tf+=(q.failed||[]).length;rd+=q.dropped||0;if(q.status!=='ok')pq++;});
  if(tf)parts.push(tf+' trainer call'+(tf!==1?'s':'')+' failed');
  if(rd)parts.push(rd+' row'+(rd!==1?'s':'')+' skipped (bad dates)');
  var vf=Object.keys(_visaErr).length;
  if(vf)parts.push('visas missing for '+vf+' trainer'+(vf!==1?'s':''));
  return parts.join(' \u00b7 ');
}

// ── START / SYNC / REFRESH ────────────────────────────────────────────────────
function resetData(){
  _allTrainers=[];_visaCache={};_visaErr={};_visasReady=false;_assignCache={};_unallocated=[];
  _quarters={};_quarterErr={};_loadingQuarters={};_stats={emptyDMs:[],failedDMs:[],rosterError:''};_loaded=false;
}
function handleAuthFail(e){
  if(_loadCtrl){try{_loadCtrl.abort();}catch(x){}}
  _busy=false;_refreshing=false;
  setRefreshUI(false);
  var ib=$('init-bar');if(ib)ib.style.display='none';
  var ls=$('load-status');if(ls){ls.style.display='';}
  setLoadStatus('Credentials rejected \u2014 reconnect to continue');
  stopUnallocRefresh();
  openConnect({message:(e&&e.message)?e.message:'The API rejected the credentials.',error:true});
}
function setRefreshUI(on){
  var btn=$('refresh-btn'),icon=$('refresh-icon');
  if(btn)btn.disabled=on;
  if(icon)icon.style.animation=on?'sp .7s linear infinite':'';
}
function visibleQuarters(){
  var b=getActiveDateBounds();
  return quartersSpanning(b.start,b.end);
}
function start(){
  var today=startOfToday();
  _weekStart=getMondayOf(today);
  var thisQ=getQuarter(today);
  var ctrl=newLoadGeneration(),signal=ctrl.signal;
  var warm=cacheLoad();

  if(warm){
    _loaded=true;hideInitBar();
    setLoadStatus(statusLine()+' \u00b7 cached '+ageText(_cacheAgeMs)+', syncing\u2026');
    renderBoard();
    fetchUnallocated();startUnallocRefresh();
    var qs=[thisQ];
    visibleQuarters().forEach(function(q){if(!qs.some(function(x){return x.key===q.key;})&&_quarters[q.key])qs.push(q);});
    syncRoster(signal)
      .then(function(){return loadQuarters(qs,signal);})
      .then(function(errs){
        if(signal.aborted)return;
        cacheSave();renderBoard();
        setLoadStatus(errs.length?('Couldn\u2019t refresh '+errs.join('; ')+' \u2014 showing cached data'):statusLine()+' \u00b7 synced '+clockTime(new Date()));
        return loadVisas(signal);
      })
      .then(function(){
        if(signal.aborted)return;
        renderBoard();refreshPanelVisa();setLoadStatus(statusLine()+' \u00b7 synced '+clockTime(new Date()));
      })
      .catch(function(e){
        if(isAbort(e))return;
        if(e.auth){handleAuthFail(e);return;}
        console.warn('[warm sync]',e&&e.message);
        setLoadStatus('Couldn\u2019t refresh ('+e.message+') \u2014 showing cached data');
      })
      .then(function(){endBusy(ctrl);renderBoard();});
    return;
  }

  setSt('Loading rosters\u2026');
  syncRoster(signal).then(function(){
    setSt('Got '+_allTrainers.length+' trainers \u2014 loading assignments\u2026');
    fetchUnallocated();startUnallocRefresh();
    return loadQuarters([thisQ],signal,{onPartial:function(fresh){
      // Early paint so the board is usable while the rest streams in. Additive only; the
      // final applyQuarter() replaces these with the complete, reconciled set.
      if(_loaded||signal.aborted)return;
      Object.keys(fresh).forEach(function(id){_assignCache[id]=fresh[id];});
      _loaded=true;renderBoard();
    }});
  }).then(function(errs){
    if(errs.length)throw new Error(errs[0]);
    _loaded=true;hideInitBar();
    cacheSave();renderBoard();
    setLoadStatus(statusLine());
    setLoadStatus(statusLine()+' \u00b7 loading visas\u2026');
    return loadVisas(signal);
  }).then(function(){
    if(signal.aborted)return;
    renderBoard();refreshPanelVisa();setLoadStatus(statusLine());
  }).catch(function(e){
    if(isAbort(e))return;
    if(e.auth){handleAuthFail(e);return;}
    console.error(e);
    var wasLoaded=_loaded;
    setSt('Error: '+e.message);
    if(wasLoaded){hideInitBar();setLoadStatus('Load incomplete: '+e.message);}
  }).then(function(){endBusy(ctrl);renderBoard();});
}

function refreshAll(){
  if(!hasCreds()){openConnect({});return;}
  var ctrl=newLoadGeneration(),signal=ctrl.signal;
  _refreshing=true;setRefreshUI(true);
  setLoadStatus('Refreshing\u2026');
  var keys=Object.keys(_quarters);
  var quarters=keys.length?keys.map(quarterFromKey):[getQuarter(new Date())];
  var cur=getQuarter(new Date()).key;
  if(!quarters.some(function(q){return q.key===cur;}))quarters.unshift(getQuarter(new Date()));
  fetchUnallocated();
  // Old data stays on screen and stays usable until each replacement has actually arrived.
  syncRoster(signal)
    .then(function(){return loadQuarters(quarters,signal);})
    .then(function(errs){
      if(signal.aborted)return;
      renderBoard();
      var msg=errs.length?('Refresh incomplete \u2014 '+errs.join('; ')+' (previous data kept)'):'';
      return loadVisas(signal).then(function(){
        if(signal.aborted)return;
        cacheSave();renderBoard();refreshPanelVisa();
        setLoadStatus(msg||(statusLine()+' \u00b7 refreshed '+clockTime(new Date())));
      });
    })
    .catch(function(e){
      if(isAbort(e))return;               // superseded — the newer load reports for itself
      if(e.auth){handleAuthFail(e);return;}
      console.warn('[refresh]',e&&e.message);
      setLoadStatus('Refresh failed: '+e.message+' \u2014 previous data kept');
    })
    .then(function(){
      if(endBusy(ctrl)){_refreshing=false;setRefreshUI(false);renderBoard();}
    });
}

// Called from the banner: load (or reload) the quarters in view.
function loadVisiblePeriod(){
  if(_busy||!hasCreds())return;

  if(!todo.length)return;

  }).catch(function(e){
    if(isAbort(e))return;

    setLoadStatus('Load failed: '+e.message);
  }).then(function(){endBusy(ctrl);renderBoard();});
}

// ── UNALLOCATED (apikey 190) ──────────────────────────────────────────────────
var _unallocTimer=null,_uaSeq=0,_uaFail=0,_uaLast=null;
function panelIsOpen(){var p=$('sc-panel');return !!(p&&p.classList.contains('open'));}
function setUnallocIndicator(state){
  var ri=$('unalloc-refresh-indicator');if(!ri)return;
  ri.textContent='';
  var dot=document.createElement('span'),txt=document.createElement('span');
  if(state==='live'){dot.className='refresh-pulse';txt.textContent='Live';}
  else if(state==='stale'){dot.className='stale-dot';txt.textContent='Stale'+(_uaLast?' \u00b7 last ok '+clockTime(_uaLast):'');}
  else{txt.textContent='Paused';}
  ri.appendChild(dot);ri.appendChild(txt);
}
function fetchUnallocated(){
  var seq=++_uaSeq;
  return kF(190,{},null,{retries:1}).then(function(rows){
    if(seq!==_uaSeq)return;                       // an older response must not overwrite a newer one
    if(!Array.isArray(rows))throw new Error('Unexpected response');
    _unallocated=rows;_uaFail=0;_uaLast=new Date();
    setUnallocIndicator('live');
    var busyUI=panelIsOpen()||!!_searchQuery;
    if(_activeTab==='Unallocated'&&!busyUI)renderBoard();else updateBadges();
  }).catch(function(e){
    if(seq!==_uaSeq)return;
    if(e.auth){handleAuthFail(e);return;}
    _uaFail++;setUnallocIndicator('stale');
    console.warn('[190]',e.message);
  });
}
function startUnallocRefresh(){clearInterval(_unallocTimer);_unallocTimer=setInterval(fetchUnallocated,CONFIG.UNALLOC_POLL_MS);}
function stopUnallocRefresh(){clearInterval(_unallocTimer);_unallocTimer=null;}
function bindVisibilityPause(){
  document.addEventListener('visibilitychange',function(){
    if(document.hidden){stopUnallocRefresh();setUnallocIndicator('paused');}
    else if(_loaded&&hasCreds()){fetchUnallocated();startUnallocRefresh();}
  });
  window.addEventListener('pagehide',stopUnallocRefresh);
}
function extractScid(html){
  if(!html)return null;
  var m=String(html).match(/scid=(\d+)/i);
  return m?m[1]:null;
}
function scUrl(scId){
  if(!scId)return null;
  var id=String(scId).replace(/^#/,'').trim();if(!id)return null;
  var u=CONFIG.RMS_CARD_URL+'?scid='+encodeURIComponent(id);
  if(CREDS.sc)u+='&PDFTran='+encodeURIComponent(CREDS.sc);
  return u;
}
