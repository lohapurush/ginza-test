// ── MATCHING ──────────────────────────────────────────────────────────────────
var _scidCache={};   // assignmentId -> scid string, or '' when the API had none
function matchStr(hay,needle){return !!hay&&String(hay).toLowerCase().indexOf(needle)>=0;}
function allocMatchesQuery(a,q){
  if(matchStr(a.course,q)||matchStr(a.vendor,q)||matchStr(a.location,q)||matchStr(a.assignId,q)||matchStr(a.mode,q))return true;
  if(_scidCache[a.assignId]&&matchStr(_scidCache[a.assignId],q))return true;
  return a.trainers.some(function(t){return matchStr(t.name,q)||matchStr(t.email,q);});
}
function unallocMatchesQuery(row,q){
  var scid=extractScid(row.SCID||'');
  return matchStr(row.Coursename,q)||matchStr(row.vendor,q)||matchStr(row['Assignment City'],q)||matchStr(row['Assignment Country'],q)
    ||matchStr(row.AssignmentID,q)||matchStr(scid,q)||matchStr(row.fmatRemarks,q);
}
function unallocPassesChips(row){
  if(_chips.tentative&&row['Tentetive or Not']!=='Yes')return false;
  if(_chips.thirdParty&&row['Third Party']!=='Yes')return false;
  return true;
}
function itemPassesFilters(item,tab,q){
  if(tab==='Unallocated'){
    if(q&&!unallocMatchesQuery(item,q))return false;
    if(!unallocPassesChips(item))return false;
  }else if(q&&!allocMatchesQuery(item,q))return false;
  return true;
}
function getAllAssignments(tab){
  if(tab==='Unallocated')return _unallocated.slice();
  var all=Object.keys(_assignCache).map(function(k){return _assignCache[k];});
  if(tab==='All')return all;
  return all.filter(function(a){return modeBucket(a.mode)===tab;});
}
function itemDateRange(item,tab){return tab==='Unallocated'?unallocDates(item):{sd:item.sDate,ed:item.eDate};}
function itemId(item,tab){return tab==='Unallocated'?String(item.AssignmentID||''):item.assignId;}
function getActiveDateBounds(){
  if(_customRange)return{start:_customRange.start,end:_customRange.end};
  return{start:_weekStart,end:addDays(_weekStart,6)};
}
// Nearest in time to the visible span (ties prefer the future).
function nearestItem(items,tab,vs,ve){
  var best=null,bd=Infinity;
  items.forEach(function(it){
    var r=itemDateRange(it,tab);if(!r.sd||!r.ed)return;
    var d=0;
    if(r.ed<vs)d=daysBetween(r.ed,vs)+0.5;else if(r.sd>ve)d=daysBetween(ve,r.sd);
    if(d<bd){bd=d;best=it;}
  });
  return best;
}
function tabMatchCounts(q){
  var out={};
  TAB_ORDER.forEach(function(t){
    if(t==='All')return;
    if(t==='Other'&&!$('tab-Other')||t==='Other'&&$('tab-Other').style.display==='none')return;
    var items=getAllAssignments(t);
    var n=items.filter(function(it){
      if(t==='Unallocated')return unallocMatchesQuery(it,q);
      return allocMatchesQuery(it,q);
    }).length;
    if(n)out[t]=n;
  });
  return out;
}

// ── BADGES ────────────────────────────────────────────────────────────────────
function updateBadges(){
  var range=getActiveDateBounds();
  var all=Object.keys(_assignCache).map(function(k){return _assignCache[k];});
  ['ILT','ILO','FMAT','Other'].forEach(function(tab){
    var n=all.filter(function(a){return modeBucket(a.mode)===tab&&a.sDate<=range.end&&a.eDate>=range.start;}).length;
    var el=$('bdg-'+tab);if(el)el.textContent=n;
  });
  var otherAll=all.filter(function(a){return modeBucket(a.mode)==='Other';});
  var ot=$('tab-Other');
  if(ot){
    ot.style.display=(otherAll.length||_activeTab==='Other')?'':'none';
    if(otherAll.length){
      var kinds={};
      otherAll.forEach(function(a){var k=a.mode||'(blank)';kinds[k]=(kinds[k]||0)+1;});
      ot.title='Delivery modes with no dedicated tab: '+Object.keys(kinds).map(function(k){return k+' ('+kinds[k]+')';}).join(', ');
    }
  }
  if(_view==='list'){
    // In the list the badges count what the chosen scope shows, not what overlaps one week.
    var cnt={All:0,ILT:0,ILO:0,FMAT:0,Other:0};
    all.forEach(function(a){if(!inScope(a.sDate,a.eDate))return;cnt.All++;cnt[modeBucket(a.mode)]++;});
    Object.keys(cnt).forEach(function(k){var el=$('bdg-'+k);if(el)el.textContent=cnt[k];});
  }
  var uel=$('bdg-Unallocated');
  if(uel){
    uel.textContent=_unallocated.length;
    var inView=0,undated=0;
    _unallocated.forEach(function(row){
      var d=unallocDates(row);
      if(!d.sd||!d.ed){undated++;return;}
      if(d.sd<=range.end&&d.ed>=range.start)inView++;
    });
    if(_view==='list'){var un=0;_unallocated.forEach(function(r){var d=unallocDates(r);if(inScope(d.sd,d.ed))un++;});uel.textContent=un;}
    uel.title=_unallocated.length+' unallocated in total \u00b7 '+inView+' in the current view'+(undated?' \u00b7 '+undated+' without usable dates':'');
  }
}

// ── ROW PACKING ───────────────────────────────────────────────────────────────
function packRows(items,cap,numCols){
  var rowEnds=[],overflow=[],perCol=new Array(numCols).fill(0);
  items.forEach(function(it){
    var endCol=it.startCol+it.span-1,placed=false;
    for(var r=0;r<rowEnds.length;r++){
      if(rowEnds[r]<it.startCol){it.row=r;rowEnds[r]=endCol;placed=true;break;}
    }
    if(!placed){
      if(cap&&rowEnds.length>=cap){
        overflow.push(it);
        for(var c=it.startCol;c<=endCol&&c<numCols;c++)perCol[c]++;
        return;
      }
      it.row=rowEnds.length;rowEnds.push(endCol);
    }
  });
  return{rows:rowEnds.length,overflow:overflow,perCol:perCol};
}

// ── LOADED-RANGE BANNER ───────────────────────────────────────────────────────
// "No work" and "no data" must never look the same on a scheduling board.
function renderRangeBanner(start,end){
  var el=$('range-banner');if(!el)return;
  if(_activeTab==='Unallocated'){el.style.display='none';return;}
  var qs=quartersSpanning(start,end);
  var missing=qs.filter(function(q){return !_quarters[q.key];});
  var partial=qs.filter(function(q){return _quarters[q.key]&&_quarters[q.key].status!=='ok';});
  var errored=qs.filter(function(q){return _quarterErr[q.key];});
  if(!missing.length&&!partial.length&&!errored.length){el.style.display='none';return;}
  var loading=qs.some(function(q){return _loadingQuarters[q.key];})||_busy;
  var msg='';
  if(errored.length){
    msg=errored.map(function(q){return q.key;}).join(', ')+' could not be loaded: '+_quarterErr[errored[0].key]+'.';
  }else if(missing.length){
    msg=missing.map(function(q){return q.key;}).join(' and ')+' '+(missing.length>1?'have':'has')+' not been fetched yet, so this period may look emptier than it is.';
  }else{
    var nf=0;partial.forEach(function(q){nf+=_quarters[q.key].failed.length;});
    msg=partial.map(function(q){return q.key;}).join(' and ')+' loaded without '+nf+' trainer'+(nf!==1?'s':'')+' whose requests failed, so some of their assignments may be missing.';
  }
  var label=(errored.length||partial.length&&!missing.length)?'Retry':'Load '+missing.map(function(q){return q.key;}).join(' + ');
  el.className='range-banner'+((errored.length||partial.length)?' warn':'');
  el.style.display='';
  el.innerHTML='<i class="ti ti-alert-circle" style="font-size:14px" aria-hidden="true"></i><span class="rb-msg">'+es(msg)+'</span>'
    +'<button class="btn" data-act="load-period"'+(loading?' disabled':'')+'>'+(loading?'Working\u2026':es(label))+'</button>';
}

function emptyMessage(q,chipsActive,isCustom,start,end){
  var where=isCustom?'in this range':'this week';
  if(_activeTab!=='Unallocated'&&missingQuarters(start,end).length)return 'This period has not been fetched yet \u2014 load it above to see what is scheduled.';
  if(q&&chipsActive)return 'Nothing '+where+' matches \u201c'+q+'\u201d with those filters on.';
  if(q)return 'Nothing '+where+' matches \u201c'+q+'\u201d.';
  if(chipsActive)return 'Nothing '+where+' matches those filters.';
  if(_activeTab==='Unallocated')return 'No unallocated assignments '+where+' \u2014 the queue is clear.';
  return 'No '+_activeTab+' assignments '+where+'.';
}

// ── RENDER BOARD ──────────────────────────────────────────────────────────────
var _boardOrder=[];
function renderBoardInner(){
  if(!_loaded)return;
  var today=startOfToday(),isCustom=!!_customRange,days=[];
  if(isCustom){var d=new Date(_customRange.start);while(d<=_customRange.end){days.push(new Date(d));d=addDays(d,1);}}
  else for(var i=0;i<7;i++)days.push(addDays(_weekStart,i));
  var weekEnd=days[days.length-1],numCols=days.length;

  syncChrome();
  var wl=$('wk-label');
  if(wl)wl.textContent=formatDisplay(days[0],true)+' \u2013 '+formatDisplay(weekEnd,true)+(isCustom?' ('+numCols+' days)':'');
  updateBadges();

  // Week view: seven flexible columns that never shrink below 46px (the strip scrolls on phones).
  // Custom range: fixed 64px columns. The stylesheet no longer overrides either with !important.
  var colTemplate=isCustom?'repeat('+numCols+',64px)':'repeat(7,minmax(46px,1fr))';
  var minW=isCustom?(numCols*64+(numCols-1)*4+12)+'px':'';
  var hdr=$('wk-hdr');
  if(hdr){
    hdr.style.gridTemplateColumns=colTemplate;hdr.style.minWidth=minW;
    hdr.innerHTML=days.map(function(d){
      var isT=sameDay(d,today),isW=d.getDay()===0||d.getDay()===6;
      var yr=(d.getFullYear()!==today.getFullYear())?' \u2019'+String(d.getFullYear()).slice(2):'';
      return '<div class="wk-day'+(isT?' today':'')+(isW?' weekend':'')+'"'+(isT?' aria-current="date"':'')+'><div class="dn">'+DAYS[(d.getDay()+6)%7]+'</div><div class="dd">'+d.getDate()+' '+MONTHS[d.getMonth()]+yr+'</div></div>';
    }).join('');
  }
  renderRangeBanner(days[0],weekEnd);

  var q=_searchQuery.trim().toLowerCase(),chipsActive=_chips.tentative||_chips.thirdParty;
  var allItems=getAllAssignments(_activeTab);
  var dated=[],undated=[];
  allItems.forEach(function(it){var r=itemDateRange(it,_activeTab);(r.sd&&r.ed?dated:undated).push(it);});
  var weekItems=dated.filter(function(it){var r=itemDateRange(it,_activeTab);return r.sd<=weekEnd&&r.ed>=days[0];});
  var matched=(q||chipsActive)?weekItems.filter(function(it){return itemPassesFilters(it,_activeTab,q);}):weekItems;

  // Nothing here for the query → jump to the NEAREST week that has a match (not the earliest).
  // Guarded: settled query only, week view only, items with both dates only, recursion capped.
  if(q&&matched.length===0&&!isCustom&&_allowJump&&_jumpGuard<3){
    var target=nearestItem(dated.filter(function(it){return itemPassesFilters(it,_activeTab,q);}),_activeTab,days[0],weekEnd);
    if(target){
      var tw=getMondayOf(itemDateRange(target,_activeTab).sd);
      if(tw.getTime()!==_weekStart.getTime()){
        _weekStart=tw;_pendingHighlightId=itemId(target,_activeTab);
        _jumpGuard++;renderBoard();_jumpGuard--;return;
      }
    }
  }

  // undated unallocated rows can't sit on a calendar, but they must not vanish
  var ud=$('undated');
  if(ud){
    var undatedShown=_activeTab==='Unallocated'?undated.filter(function(it){return itemPassesFilters(it,'Unallocated',q);}):[];
    if(undatedShown.length){
      ud.innerHTML='<details class="undated"><summary>'+undatedShown.length+' unallocated assignment'+(undatedShown.length!==1?'s':'')+' without usable dates</summary><ul>'
        +undatedShown.map(function(r){return '<li><button type="button" data-act="open" data-kind="unalloc" data-id="'+es(String(r.AssignmentID||''))+'">'+es(r.Coursename||'(no course name)')+' \u00b7 #'+es(String(r.AssignmentID||''))+'</button></li>';}).join('')
        +'</ul></details>';
    }else ud.innerHTML='';
  }

  if(!matched.length){
    _boardOrder=[];
    var raw=_searchQuery.trim(),hints='';
    if(raw){
      var elsewhere=dated.filter(function(it){return itemPassesFilters(it,_activeTab,q);}).length;
      if(elsewhere&&!isCustom)hints+='<button class="btn" data-act="jump-nearest">Jump to nearest match ('+elsewhere+' in other weeks)</button>';
      var tc=tabMatchCounts(q);
      Object.keys(tc).forEach(function(t){if(t!==_activeTab)hints+='<button class="btn" data-act="tab" data-tab="'+es(t)+'">'+tc[t]+' in '+es(t)+'</button>';});
      hints+='<button class="btn" data-act="deep" data-q="'+es(raw)+'">Search everywhere</button>';
    }
    $('wk-board').innerHTML='<div class="wk-empty" style="flex-direction:column;text-align:center;padding:18px 12px"><div>'+es(emptyMessage(raw,chipsActive,isCustom,days[0],weekEnd))+'</div>'
      +(hints?'<div class="hint-bar">'+hints+'</div>':'')+'</div>';
    $('sum-bar').innerHTML='<span>Nothing to show '+(isCustom?'in this range':'this week')+'</span>';
    return;
  }

  var placed=matched.map(function(item){
    var r=itemDateRange(item,_activeTab);
    var s=r.sd<days[0]?days[0]:r.sd,e=r.ed>weekEnd?weekEnd:r.ed;
    var startCol=daysBetween(days[0],s),endCol=daysBetween(days[0],e);
    return{item:item,startCol:startCol,span:endCol-startCol+1};
  }).sort(function(a,b){return a.startCol-b.startCol||a.span-b.span;});

  var pack=packRows(placed,_rowsExpanded?0:CONFIG.ROW_CAP,numCols);
  var numRows=pack.rows+(pack.overflow.length?1:0);
  _boardOrder=placed.map(function(p){return{kind:_activeTab==='Unallocated'?'unalloc':'alloc',id:itemId(p.item,_activeTab)};});

  var html='<div class="wk-grid" style="grid-template-rows:repeat('+numRows+',auto);grid-template-columns:'+colTemplate+';'+(minW?'min-width:'+minW+';':'')+'">';
  for(var ci=0;ci<numCols;ci++){
    var day=days[ci],isT=sameDay(day,today),isW=day.getDay()===0||day.getDay()===6;
    html+='<div class="wk-bg'+(isT?' today':'')+(isW?' weekend':'')+'" style="grid-column:'+(ci+1)+'" aria-hidden="true"></div>';
  }
  placed.forEach(function(p){
    if(p.row===undefined)return;
    var style='grid-column:'+(p.startCol+1)+' / span '+p.span+';grid-row:'+(p.row+1)+';';
    html+=(_activeTab==='Unallocated')?renderUnallocCard(p.item,p.span,style):renderAllocCard(p.item,p.span,style);
  });
  if(pack.overflow.length){
    for(var oc=0;oc<numCols;oc++){
      if(!pack.perCol[oc])continue;
      html+='<button type="button" class="ac-more" data-act="expand" style="grid-column:'+(oc+1)+';grid-row:'+numRows+';" title="Show all rows" aria-label="Show '+pack.perCol[oc]+' more">+'+pack.perCol[oc]+'</button>';
    }
  }
  html+='</div>';
  $('wk-board').innerHTML=html;
  renderSummary(matched,_activeTab,isCustom,numCols,pack.overflow.length);

  if(_pendingHighlightId){
    var hid=_pendingHighlightId;_pendingHighlightId=null;
    var sel=document.querySelector('[data-id="'+(window.CSS&&CSS.escape?CSS.escape(hid):hid)+'"]');
    if(sel){sel.classList.add('flash');setTimeout(function(){sel.classList.remove('flash');},1400);sel.scrollIntoView({block:'center',behavior:'smooth'});}
  }
}

function vdotHtml(state,title){
  var cls={ok:'v-ok',risk:'v-risk',gap:'v-gap',unknown:'v-unk'}[state];
  if(!cls)return '';
  return '<span class="vdot '+cls+'" role="img" aria-label="'+es(title)+'" title="'+es(title)+'"></span>';
}
function trainerLabel(a){
  if(!a.trainers.length)return 'Unassigned';
  var parts=a.trainers.map(function(t){return String(t.name||'').trim().split(/\s+/);});
  var count={};
  parts.forEach(function(p){var k=p[0].toLowerCase();count[k]=(count[k]||0)+1;});
  // Two trainers who share a first name would be indistinguishable: add a last initial.
  var names=parts.map(function(p){return (count[p[0].toLowerCase()]>1&&p.length>1)?p[0]+' '+p[p.length-1][0].toUpperCase()+'.':p[0];});
  return names.length>2?names.slice(0,2).join(', ')+' +'+(names.length-2):names.join(', ');
}
function renderAllocCard(a,spanCols,style){
  var bucket=modeBucket(a.mode);
  var modeCls=bucket==='ILT'?'ilt':bucket==='ILO'?'ilo':bucket==='FMAT'?'fmat':'other';
  var trainerStr=trainerLabel(a);
  var oddTag=(bucket==='Other'&&spanCols>=2)?'<span class="ac-tag addl">'+es(a.mode||'no mode')+'</span>':'';
  var dot='',visaLabel='';
  var vs=cardVisaStatus(a);
  if(vs){
    var detail=vs.per.map(function(p){return p.t.name+': '+p.res.note;}).join('; ');
    var ttl=VISA_LABEL[vs.state]+(vs.country?' ('+countryDisplay(vs.country)+')':'')+(detail?' \u2014 '+detail:'');
    dot=vdotHtml(vs.state,ttl);visaLabel=' \u00b7 '+VISA_LABEL[vs.state]+(vs.country?' for '+countryDisplay(vs.country):'');
  }
  var extra='';
  if(spanCols>=2){
    var loc=a.location?'<span class="ac-loc">'+es(a.location)+'</span>':'';
    var sep=(a.location&&a.vendor)?'<span class="ac-sep">\u00b7</span>':'';
    var vend=a.vendor?'<span class="ac-vendor">'+es(a.vendor)+'</span>':'';
    extra+='<div class="ac-meta">'+oddTag+dot+loc+sep+vend+'<span class="ac-pax">'+es(paxTxt(a.pax))+'</span></div>';
  }
  if(spanCols>=4)extra+='<div class="ac-dates">'+es(formatDisplay(a.sDate))+' \u2013 '+es(formatDisplay(a.eDate))+'</div>';
  var aria=a.course+', '+trainerStr+', '+formatDisplay(a.sDate,true)+' to '+formatDisplay(a.eDate,true)+visaLabel;
  return '<div class="ac '+modeCls+'" style="'+style+'" data-kind="alloc" data-id="'+es(a.assignId)+'" role="button" tabindex="0" aria-label="'+es(aria)+'">'
    +'<div class="ac-title">'+(spanCols<2&&dot?dot+' ':'')+es(a.course)+'</div>'
    +'<div class="ac-trainer">'+es(trainerStr)+'</div>'+extra+'</div>';
}
function renderUnallocCard(row,spanCols,style){
  var tentative=row['Tentetive or Not']==='Yes',thirdParty=row['Third Party']==='Yes';
  var addl=String(row['Allocation Required For']||'').toLowerCase().indexOf('additional')>=0;
  var loc=(row['Assignment City']||'')+(row['Assignment Country']?' \u00b7 '+row['Assignment Country']:'');
  var tags='';
  if(spanCols>=2){
    if(tentative)tags+='<span class="ac-tag tent">Tentative</span>';
    if(thirdParty)tags+='<span class="ac-tag">3rd party</span>';
    if(addl)tags+='<span class="ac-tag addl">Additional</span>';
  }
  var extra='';
  if(spanCols>=2){
    var vend=row.vendor?'<span class="ac-vendor">'+es(row.vendor)+'</span>':'';
    extra+='<div class="ac-meta">'+tags+vend+'<span class="ac-pax">'+es(paxTxt(toPax(row.NoOfParticipants)))+'</span></div>';
  }
  var remarks=String(row.fmatRemarks||'').trim();
  if(spanCols>=4&&remarks)extra+='<div style="font-size:10px;opacity:.88;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;" title="'+es(remarks)+'">'+es(remarks.slice(0,60))+'</div>';
  var aria=(row.Coursename||'Assignment')+(loc?', '+loc:'')+', unallocated'+(tentative?', tentative':'');
  var id=String(row.AssignmentID||'');
  return '<div class="ac unalloc'+(tentative?' tentative':'')+'" style="'+style+'" data-kind="unalloc" data-id="'+es(id)+'" role="button" tabindex="0" aria-label="'+es(aria)+'">'
    +'<div class="ac-title">'+es(row.Coursename||'')+'</div>'
    +(loc?'<div class="ac-trainer" style="font-size:10px">'+es(loc)+'</div>':'')+extra+'</div>';

function renderSummary(items,tab,isCustom,numDays,overflowCount){
  var sb=$('sum-bar');if(!sb)return;
  var total=items.length,period=isCustom?('across '+numDays+' days'):'this week',html;
  if(tab==='Unallocated'){
    html='<span><span class="sum-n">'+total+'</span> unallocated assignment'+(total!==1?'s':'')+' '+period+'</span>';
    html+='<span><span class="sum-n">'+_unallocated.length+'</span> in the full backlog</span>';
  }else{
    var pax=0,unk=0;
    items.forEach(function(a){if(a.pax==null)unk++;else pax+=Number(a.pax);});
    html='<span><span class="sum-n">'+total+'</span> '+es(tab)+' assignment'+(total!==1?'s':'')+' '+period+'</span>';
    html+='<span><span class="sum-n">'+pax+'</span> participants'+(unk?' <span title="Participant count missing on '+unk+' assignment'+(unk!==1?'s':'')+'">(+'+unk+' unknown)</span>':'')+'</span>';
    if(tab==='ILT'){
      var gaps=0,risks=0;
      items.forEach(function(a){var v=cardVisaStatus(a);if(!v)return;if(v.state==='gap')gaps++;else if(v.state==='risk')risks++;});
      if(gaps)html+='<span style="color:var(--gap);font-weight:600">'+gaps+' with no valid visa</span>';
      if(risks)html+='<span style="color:var(--risk);font-weight:600">'+risks+' with a visa that only partly covers</span>';
      var um=0;
      items.forEach(function(a){var v=visaAssess(a);if(v.applicable&&!v.country&&v.state==='unknown')um++;});
      if(um)html+='<span><button class="search-clear" type="button" data-act="settings" style="color:var(--risk);font-weight:600" title="Open Settings to map these locations to countries">'+um+' with an unrecognised location</button></span>';
    }
  }
  if(overflowCount)html+='<span style="margin-left:auto"><button class="search-clear" data-act="'+(_rowsExpanded?'collapse':'expand')+'">'+(_rowsExpanded?'Collapse rows':overflowCount+' hidden \u2014 show all')+'</button></span>';
  else if(_rowsExpanded)html+='<span style="margin-left:auto"><button class="search-clear" data-act="collapse">Collapse rows</button></span>';
  sb.innerHTML=html;
}

// Public entry point: render, then size the board frame to the space left in the window.
function renderBoard(){if(_view==='list')renderList();else renderBoardInner();fitBoard();}
function fitBoard(){
  var w=$(_view==='list'?'list-wrap':'board-scroll-wrap');
  if(!w)return;
  var r=w.getBoundingClientRect(),docTop=r.top+window.pageYOffset;
  // Height of what sits under the frame. Measured from the elements themselves, because the
  // board card stretches to fill the page and its own bottom edge says nothing about content.
  var below=2;
  ['undated','sum-bar'].forEach(function(id){
    var e=$(id);if(!e)return;
    var cs=getComputedStyle(e);
    below+=e.getBoundingClientRect().height+(parseFloat(cs.marginTop)||0)+(parseFloat(cs.marginBottom)||0);
  });
  var avail=window.innerHeight-docTop-below-18;                // 18 = panel bottom padding
  w.style.maxHeight=Math.max(avail,300)+'px';
}

if(document.fonts&&document.fonts.ready)document.fonts.ready.then(fitBoard);

// DRILL-DOWN PANEL
// Every async callback checks _pn.tok, so a slow response for assignment A can
// never overwrite the panel after the user has moved on to B (or closed it).

var _pn={tok:0,kind:'',id:'',trigger:null,origin:null,summary:'',scid:''};
var _scCard={};      // scid -> rows
var _deepCtrl=null;

function setInert(on){var app=$('app');if(!app)return;if(on)app.setAttribute('inert','');else app.removeAttribute('inert');}
function showDrawer(){
  var p=$('sc-panel'),b=$('panel-backdrop');
  var wasOpen=panelIsOpen();
  if(!wasOpen){
    _pn.trigger=document.activeElement;
    var c=_pn.trigger&&_pn.trigger.closest?_pn.trigger.closest('.ac[data-kind],.lrow[data-kind]'):null;
    _pn.origin=c?{kind:c.getAttribute('data-kind'),id:c.getAttribute('data-id')}:null;
  }
  p.classList.add('open');p.setAttribute('aria-hidden','false');b.classList.add('open');
  setInert(true);
  if(!wasOpen)setTimeout(function(){var cb=$('pn-close');if(cb&&panelIsOpen())cb.focus();},30);
  return wasOpen;
}
function closePanel(){
  if(_deepCtrl){try{_deepCtrl.abort();}catch(e){}_deepCtrl=null;}
  _pn.tok++;
  var p=$('sc-panel'),b=$('panel-backdrop');
  if(!p||!p.classList.contains('open'))return;
  p.classList.remove('open');p.setAttribute('aria-hidden','true');b.classList.remove('open');
  setInert(false);
  var target=null;
  if(_pn.trigger&&document.contains(_pn.trigger)&&_pn.trigger!==document.body)target=_pn.trigger;
  if(!target&&_pn.origin){
    var oid=(window.CSS&&CSS.escape?CSS.escape(_pn.origin.id):_pn.origin.id);
    target=document.querySelector('.ac[data-kind="'+_pn.origin.kind+'"][data-id="'+oid+'"],.lrow[data-kind="'+_pn.origin.kind+'"][data-id="'+oid+'"] .lt-open');
  }
  if(!target)target=$('search-input');
  try{if(target&&target.focus)target.focus();}catch(e){}

  setTimeout(function(){
    if(panelIsOpen())return;
    var body=$('panel-body');if(body)body.innerHTML='';
  },300);
}
function setHeader(o){

function boardIndex(){

// ── building blocks ──
function modePill(mode){
  var b=modeBucket(mode),cls=b==='ILT'?'ilt':b==='ILO'?'ilo':b==='FMAT'?'fmat':'oth';
  return '<span class="pill p-mode '+cls+'">'+es(mode||'No mode set')+'</span>';
}
function idSub(id,kind){
  return '<span>'+(kind||'Assignment')+' #'+es(id)+'</span><button class="pn-chipbtn" type="button" data-act="copy" data-text="'+es(id)+'" aria-label="Copy assignment ID"><i class="ti ti-copy" aria-hidden="true"></i> Copy ID</button>';
}
function facts(pairs){
  var h='<dl class="pn-facts">';
  pairs.forEach(function(p){if(p&&p[1]!=null&&p[1]!=='')h+='<dt>'+es(p[0])+'</dt><dd'+(p[2]?' id="'+p[2]+'"':'')+'>'+p[1]+'</dd>';});
  return h+'</dl>';

function secHtml(title,small,inner,id){
  return '<section class="pn-sec"'+(id?' id="'+id+'"':'')+'><div class="pn-sec-h"><span>'+es(title)+'</span>'+(small?'<small>'+es(small)+'</small>':'')+'</div>'+inner+'</section>';
}
function courseStatus(sd,ed,unalloc){
  var t=startOfToday(),n=daysBetween(sd,ed)+1;
  if(t<sd){
    var d=daysBetween(t,sd);
    return{cls:unalloc?'p-risk':'p-info',text:(d===0?'Starts today':d===1?'Starts tomorrow':'Starts in '+d+' days')+(unalloc?' \u2014 needs a trainer':'')};
  }
  if(t<=ed){var day=daysBetween(sd,t)+1;return{cls:unalloc?'p-gap':'p-live',text:(unalloc?'Under way, still unallocated \u2014 ':'')+'Day '+day+' of '+n};}
  var ago=daysBetween(ed,t);
  return{cls:unalloc?'p-gap':'p-unk',text:(unalloc?'Ended ':'Completed ')+ago+' day'+(ago!==1?'s':'')+' ago'+(unalloc?' \u2014 never allocated':'')};
}
function ribbonHtml(sd,ed){
  var n=daysBetween(sd,ed)+1,t=startOfToday();
  if(n>31){
    var pct=t<sd?0:t>ed?100:Math.round((daysBetween(sd,t)+1)/n*100);
    return '<div class="pn-bar" role="img" aria-label="'+n+'-day assignment, '+pct+'% elapsed"><span style="width:'+pct+'%"></span></div>';
  }
  var h='';
  for(var i=0;i<n;i++){
    var d=addDays(sd,i),cls=d<t?'past':sameDay(d,t)?'today':'';
    if(d.getDay()===0||d.getDay()===6)cls+=' wk';
    h+='<i class="'+cls+'" title="'+es(formatDisplay(d,true))+'"></i>';
  }
  return '<div class="pn-ribbon" role="img" aria-label="'+n+'-day assignment, one mark per day">'+h+'</div>';
}
function whenHtml(sd,ed,status){
  var n=daysBetween(sd,ed)+1;
  return '<div class="pn-when"><div class="pn-when-main"><div class="pn-dates">'+es(fmtRange(sd,ed))+'</div>'
    +'<div class="pn-dur">'+n+' day'+(n!==1?'s':'')+' \u00b7 '+DAYS[(sd.getDay()+6)%7]+(n>1?' to '+DAYS[(ed.getDay()+6)%7]:'')+'</div></div>'
    +(status?'<div><span class="pill '+status.cls+'">'+es(status.text)+'</span></div>':'')
    +ribbonHtml(sd,ed)+'</div>';

function skeleton(rows){var h='<div class="sk-stack" aria-busy="true">';for(var i=0;i<(rows||3);i++)h+='<div class="sk" style="width:'+(90-i*18)+'%"></div>';return h+'</div>';}

// ── allocated assignment ──
function openPanel(kind,id){
  var tok=++_pn.tok;_pn.kind=kind;_pn.id=id;_pn.scid='';
  if(_deepCtrl){try{_deepCtrl.abort();}catch(e){}_deepCtrl=null;}
  showDrawer();
  var body=$('panel-body');if(body)body.scrollTop=0;
  if(kind==='alloc'){
    var a=_assignCache[id];
    if(!a){missingPanel('This assignment is no longer in the loaded data. It may have been removed or reassigned \u2014 refresh to check.');return;}
    openAlloc(a,tok);
  }else{
    var row=null;for(var i=0;i<_unallocated.length;i++){if(String(_unallocated[i].AssignmentID)===id){row=_unallocated[i];break;}}
    if(!row){missingPanel('This assignment is no longer in the unallocated feed \u2014 it may have just been allocated.');return;}
    openUnalloc(row,tok);
  }

function summaryText(a){
  return [a.course,fmtRange(a.sDate,a.eDate),a.location,a.trainers.map(function(t){return t.name;}).join(', ')||'Unassigned',a.vendor,'Assignment #'+a.assignId].filter(Boolean).join(' \u00b7 ');
}
function openAlloc(a,tok){
  var st=courseStatus(a.sDate,a.eDate,false);
  var eyebrow=modePill(a.mode)+(a.datesVary?'<span class="pill p-info" title="Trainers on this assignment have different dates">Trainer dates differ</span>':'');
  setHeader({eyebrow:eyebrow,title:a.course||'Untitled assignment',sub:idSub(a.assignId),nav:true});
  _pn.summary=summaryText(a);
  var time=a.startTime?es(a.startTime)+(a.endTime?' \u2013 '+es(a.endTime):'')+(CONFIG.TIME_LABEL?' '+es(CONFIG.TIME_LABEL):''):'';
  var cachedScid=_scidCache[a.assignId];
  putBody(whenHtml(a.sDate,a.eDate,st)
    +secHtml('Details','',facts([
      ['Location',es(a.location)],['Vendor',es(a.vendor)],['Time',time],['Participants',es(paxTxt(a.pax))],
      ['Student card',cachedScid!==undefined?scidHtml(cachedScid):'<div class="sk" style="width:60%"></div>','pn-scid-val']
    ]))
    +secHtml('Trainers',trainersSmall(a),trainersHtml(a),'pn-trainers')
    +'<section class="pn-sec" id="pn-scard"></section>');
  putFooter(footerFor(cachedScid||''));
  resolveScidFor(a,tok);
}
function resolveScidFor(a,tok){
  var p;
  if(_scidCache[a.assignId]!==undefined)p=Promise.resolve(_scidCache[a.assignId]);
  else p=kF(173,{assignmentid:a.assignId}).then(function(rows){
    var scid='';
    if(Array.isArray(rows)&&rows.length){
      var r0=rows[0];
      scid=String(r0.SCIDs||r0.SCID||r0.scid||r0.SCId||r0.Scid||r0.SCid||r0.StudentCardId||r0.scId||r0.SCID_||'').trim();
      if(!scid)console.warn('[173] no SCID field matched \u2014 raw row:',r0);
    }
    _scidCache[a.assignId]=scid;
    return scid;
  });
  p.then(function(scid){
    if(tok!==_pn.tok)return;
    _pn.scid=scid;
    var el=$('pn-scid-val');if(el)el.innerHTML=scidHtml(scid);
    putFooter(footerFor(scid));
    if(scid)loadScCard(scid,tok);
    else{var sc=$('pn-scard');if(sc)sc.innerHTML='';}
  }).catch(function(e){
    if(tok!==_pn.tok)return;
    var el=$('pn-scid-val');
    if(el)el.innerHTML='<span style="color:var(--gap)">Lookup failed</span> <button class="sc-link" type="button" data-act="retry-scid">Retry</button>';
    console.warn('[173]',e&&e.message);
  });
}
function loadScCard(scid,tok){
  var sc=$('pn-scard');if(!sc)return;
  if(_scCard[scid]){renderScCard(scid);return;}
  sc.innerHTML='<div class="pn-sec-h"><span>Student card</span></div>'+skeleton(3);
  kF(162,{SCID:scid}).then(function(rows){
    _scCard[scid]=Array.isArray(rows)?rows:[];
    if(tok===_pn.tok)renderScCard(scid);
  }).catch(function(e){
    if(tok!==_pn.tok)return;
    var el=$('pn-scard');
    if(el)el.innerHTML='<div class="pn-sec-h"><span>Student card</span></div>'+errBlock('Could not load the student card ('+(e&&e.message||'error')+').','retry-sc');
  });
}
function renderScCard(scid){
  var el=$('pn-scard');if(!el)return;
  var rows=_scCard[scid];
  if(!rows||!rows.length){el.innerHTML='<div class="pn-sec-h"><span>Student card</span></div><p class="pn-empty">No card data returned.</p>';return;}
  var r=rows[0];
  el.innerHTML='<div class="pn-sec-h"><span>Student card</span></div>'+facts([
    ['Student',es(r.StudentName||r.CustName||'')],['Email',es(r.EmailId||r.email||'')],['Company',es(r.CompanyName||'')],
    ['Country',es(r.Country||'')],['Course status',es(r.CourseStatus||'')]
  ]);

var PILL={ok:['p-ok','v-ok','Covered'],risk:['p-risk','v-risk','Partly covered'],gap:['p-gap','v-gap','No valid visa'],unknown:['p-unk','v-unk','Unknown'],loading:['p-unk','v-unk','Loading\u2026']};
function trainersSmall(a){

function visaListHtml(email,destKey){
  var recs=_visaCache[vkey(email)];
  if(recs===undefined){
    return '<div class="pn-vl"><span class="pn-note">Visa records are not available for this trainer.</span>'
      +'<button class="btn" type="button" data-act="retry-visa" data-email="'+es(email)+'" style="align-self:flex-start;height:26px;padding:0 10px">Load visa records</button></div>';
  }
  if(!recs.length)return '<div class="pn-vl"><span class="pn-note">No visa records on file.</span></div>';
  var today=startOfToday();
  var rows=recs.map(function(r){
    var from=parseDate(r.valid_from||''),upTo=parseDate(r.valid_up_to||'');
    return{country:String(r.country_name||'').trim()||'Unnamed country',type:r.visa_type||'',from:from,upTo:upTo,doc:r.via_doc_path||'',
      cur:from&&upTo?(today>=from&&today<=upTo):!!r.valid,dest:!!destKey&&visaMatchesDest(r,destKey)};
  });
  rows.sort(function(a,b){
    if(a.dest!==b.dest)return a.dest?-1:1;
    if(a.country!==b.country)return a.country<b.country?-1:1;
    return (b.upTo?b.upTo.getTime():0)-(a.upTo?a.upTo.getTime():0);
  });
  var h='<div class="pn-vl">';
  rows.forEach(function(r){
    var status=r.cur?('<span class="d" style="color:var(--ok)">Valid'+(r.upTo?' until '+es(formatDisplay(r.upTo,true)):'')+'</span>')
      :('<span class="d">'+(r.upTo?'Expired '+es(formatDisplay(r.upTo,true)):'Dates not recorded')+'</span>');
    h+='<div class="pn-vrow'+(r.dest?' dest':'')+'"><span class="c">'+es(r.country)+(r.type?' \u00b7 '+es(r.type):'')+'</span>'+status
      +(safeUrl(r.doc)?'<a href="'+es(r.doc)+'" target="_blank" rel="noopener noreferrer" aria-label="View visa document for '+es(r.country)+'"><i class="ti ti-external-link" aria-hidden="true"></i></a>':'')+'</div>';
  });

}
function trainersHtml(a){
  if(!a.trainers.length)return '<p class="pn-empty">No trainer assigned.</p>';
  var v=visaAssess(a),cards=[];
  var mapNote=(v.applicable&&!v.country&&a.location)?'<p class="pn-note">Scouter can\u2019t tell which country \u201c'+es(a.location)+'\u201d is in, so visas can\u2019t be checked. <button class="sc-link" type="button" data-act="map-loc" data-loc="'+es(a.location)+'">Map it to a country</button></p>':'';
  a.trainers.forEach(function(t,i){
    var res=(v.applicable&&v.per[i])?v.per[i].res:null;
    var pill='';

      var P=PILL[res.state]||PILL.unknown;
      pill='<span class="pill '+P[0]+'"><span class="vdot '+P[1]+'" aria-hidden="true"></span>'+P[2]+'</span>';
    }
    var delivering=a.datesVary?'Delivering '+fmtRange(t.sDate||a.sDate,t.eDate||a.eDate)+'. ':'';
    var note=(res?res.note:'')+(res&&delivering?' ':'');
    var mail=t.email&&String(t.email).indexOf('@')>0?'<a href="mailto:'+es(t.email)+'">'+es(t.email)+'</a>':es(t.email||'');
    var count=(_visaCache[vkey(t.email)]||[]).length;

      +'<div class="pn-tr-id"><div class="pn-tr-name">'+es(t.name)+'</div><div class="pn-tr-mail">'+mail+'</div></div>'+pill+'</div>'
      +((delivering||note)?'<div class="pn-tr-note">'+es(delivering)+es(note)+'</div>':'')
      +'<details><summary>All visas on record'+(_visaCache[vkey(t.email)]!==undefined?' ('+count+')':'')+'</summary>'+visaListHtml(t.email,v.applicable?v.country:'')+'</details></div>');
  });

    ?cards.slice(0,5).join('')+'<details class="pn-more"><summary>Show '+(cards.length-5)+' more trainers</summary><div class="pn-more-body">'+cards.slice(5).join('')+'</div></details>'

// DEEP SEARCH
// Traces a term through every layer and says plainly which one lost it.
// ═════════════════════════════════════════════════════════════════════════════
function deepSearch(fragment){
  var frag=String(fragment||_searchQuery||'').trim(),q=frag.toLowerCase();
  if(!q)return;
  if(_deepCtrl){try{_deepCtrl.abort();}catch(e){}}
  _deepCtrl=null;
  var tok=++_pn.tok;_pn.kind='deep';_pn.id='';
  showDrawer();
  setHeader({eyebrow:'<span class="pill p-info">Deep search</span>',title:'\u201c'+frag+'\u201d',sub:'<span>Looks at loaded data first, then asks the live API about every rostered trainer.</span>',nav:false});
  putFooter('');

  var qs=Object.keys(_quarters).sort().join(', ')||'none';
  var head=secHtml('Load state','',facts([
    ['Quarters loaded',es(qs)],['Trainers in roster',String(_allTrainers.length)],
    ['Assignments cached',String(Object.keys(_assignCache).length)],['Unallocated rows',String(_unallocated.length)]
  ]));

  var cached=Object.keys(_assignCache).map(function(k){return _assignCache[k];}).filter(function(a){return allocMatchesQuery(a,q);});
  var un=_unallocated.filter(function(r){return unallocMatchesQuery(r,q);});
  var b=getActiveDateBounds(),found='';
  if(cached.length){
    found+=secHtml('Found in loaded assignments',cached.length+' match'+(cached.length!==1?'es':''),cached.slice(0,15).map(function(a){
      var bucket=modeBucket(a.mode),visible=a.sDate<=b.end&&a.eDate>=b.start;
      return '<div class="pn-hit"><h4>'+es(a.course)+'</h4>'+facts([
        ['Assignment ID',es(a.assignId)],['Delivery mode',es(a.mode||'(blank)')],['Shown on tab',es(bucket)+(bucket==='Other'?' \u2014 no tab of its own':'')],
        ['Dates',es(formatDisplay(a.sDate,true))+' \u2013 '+es(formatDisplay(a.eDate,true))],
        ['Trainers',es(a.trainers.map(function(t){return t.name;}).join(', ')||'none')],
        ['In current view',visible?'Yes':'No \u2014 it is in a different week or range']
      ])+'<div><button class="btn" type="button" data-act="jump" data-iso="'+es(toISO(a.sDate))+'" data-tab="'+es(bucket)+'">Go to it</button></div></div>';
    }).join(''));
  }
  if(un.length){
    found+=secHtml('Found in the unallocated feed',un.length+' match'+(un.length!==1?'es':''),un.slice(0,15).map(function(r){
      var d=unallocDates(r);
      return '<div class="pn-hit"><h4>'+es(r.Coursename||'')+'</h4>'+facts([
        ['Assignment ID',es(String(r.AssignmentID||''))],
        ['Dates',d.sd&&d.ed?es(formatDisplay(d.sd,true))+' \u2013 '+es(formatDisplay(d.ed,true)):'<span style="color:var(--gap)">Missing or unreadable \u2014 listed under the board, not on the calendar</span>'],
        ['Tentative',es(r['Tentetive or Not']||'No')]
      ])+'<div style="display:flex;gap:8px;flex-wrap:wrap">'
        +(d.sd?'<button class="btn" type="button" data-act="jump" data-iso="'+es(toISO(d.sd))+'" data-tab="Unallocated">Go to it</button>':'')
        +'<button class="btn" type="button" data-act="open" data-kind="unalloc" data-id="'+es(String(r.AssignmentID||''))+'">Open details</button></div></div>';
    }).join(''));
  }
  if(found){
    putBody(head+found
      +'<div class="pn-verdict good"><p><strong>It was fetched.</strong> If it isn\u2019t on screen, the reason is in the cards above \u2014 usually the tab or the week.</p>'
      +'<p><button class="btn" type="button" data-act="deep-sweep" data-q="'+es(frag)+'">Also sweep the live API</button></p></div>');
    return;
  }
  putBody(head+'<section class="pn-sec" id="ds-sweep"></section>');
  sweepApi(frag,tok);
}
function sweepApi(frag,tok){
  var q=frag.toLowerCase(),box=$('ds-sweep');
  if(!box){var body=$('panel-body');if(!body)return;box=document.createElement('section');box.className='pn-sec';box.id='ds-sweep';body.appendChild(box);}
  var ctrl=new AbortController();_deepCtrl=ctrl;
  var list=_allTrainers.slice(),done=0,failed=0,hits={};
  var from=toISO(addDays(new Date(),-365)),to=toISO(addDays(new Date(),365));
  box.innerHTML='<div class="pn-sec-h"><span>Live API sweep</span><small>\u00b11 year</small></div>'
    +'<div class="pn-note" id="ds-prog">Checking 0 of '+list.length+' trainers\u2026</div>'
    +'<div><button class="btn" type="button" data-act="deep-cancel">Cancel</button></div>';
  runPool(list,CONFIG.CONCURRENCY,function(t){
    return kF(16,{Startdate:from,Enddate:to,Email:t.email},ctrl.signal,{retries:1}).then(function(rows){
      (Array.isArray(rows)?rows:[]).forEach(function(r){
        if(matchStr(r.Course,q)||matchStr(r.Vendor,q)||matchStr(r.Location,q)||matchStr(r.AssignmentId,q)||matchStr(r.TrainerName,q)||matchStr(t.email,q)){
          var id=String(r.AssignmentId||'?');
          if(!hits[id])hits[id]={r:r,trainers:[]};
          if(hits[id].trainers.indexOf(t.name)<0)hits[id].trainers.push(t.name);
        }
      });
    }).catch(function(e){if(isAbort(e)||e.auth)throw e;failed++;}).then(function(){
      done++;
      var pe=$('ds-prog');if(pe&&tok===_pn.tok)pe.textContent='Checking '+done+' of '+list.length+' trainers\u2026';
    });
  },ctrl.signal).then(function(){
    if(tok!==_pn.tok||ctrl.signal.aborted)return;
    var ids=Object.keys(hits),h='<div class="pn-sec-h"><span>Live API sweep</span><small>'+list.length+' trainers, \u00b11 year</small></div>';
    if(ids.length){
      h+=ids.slice(0,25).map(function(id){
        var r=hits[id].r,sd=parseDate(r.StarDate||r.StartDate),ed=parseDate(r.EndDate||r.Enddate);
        return '<div class="pn-hit"><h4>'+es(r.Course||'')+'</h4>'+facts([
          ['Assignment ID',es(id)],['Delivery mode',es(r.Mode||'(blank)')],
          ['Dates',sd&&ed?es(formatDisplay(sd,true))+' \u2013 '+es(formatDisplay(ed,true)):es((r.StarDate||'?')+' \u2013 '+(r.EndDate||'?'))],
          ['Trainers',es(hits[id].trainers.join(', '))]
        ])+(sd?'<div><button class="btn" type="button" data-act="jump" data-iso="'+es(toISO(sd))+'" data-tab="'+es(modeBucket(r.Mode))+'">Go there and load that period</button></div>':'')+'</div>';
      }).join('');
      h+='<div class="pn-verdict good"><p><strong>The API knows about it</strong> for a trainer on your roster. If it isn\u2019t on the board, it falls outside the quarters loaded so far \u2014 use \u201cGo there\u201d to fetch that period.</p>'
        +(ids.length>25?'<p>Showing 25 of '+ids.length+' matches.</p>':'')+'</div>';
    }else{
      h+='<div class="pn-verdict bad"><p><strong>No match anywhere.</strong> Nothing in the loaded data, the unallocated feed, or the live API for '+list.length+' rostered trainers within a year either side of today.</p>'
        +'<p>Likely causes, most common first:</p><p>1. The trainer reports to a manager who isn\u2019t in Scouter\u2019s list (currently '+currentDMs().length+' managers). <button class="sc-link" type="button" data-act="settings">Add a manager</button></p>'
        +'<p>2. The term is spelt differently in RMS, or the assignment is more than a year away.</p>'
        +(failed?'<p>3. '+failed+' trainer request'+(failed!==1?'s':'')+' failed during the sweep, so this result may be incomplete.</p>':'')+'</div>';
    }
    box.innerHTML=h;_deepCtrl=null;
  }).catch(function(e){
    if(tok!==_pn.tok||isAbort(e))return;
    if(e.auth){handleAuthFail(e);return;}
    box.innerHTML='<div class="pn-sec-h"><span>Live API sweep</span></div>'+errBlock('The sweep failed: '+(e&&e.message||'unknown error'),'deep-sweep',' data-q="'+es(frag)+'"');
  });
}

function fillLocLine(loc){
  var ta=$('cn-loc');if(!ta)return;
  var key=normText(loc);
  if(ta.value.split('\n').some(function(l){return normText(l.split('=')[0])===key;})){ta.focus();return;}
  ta.value=(ta.value&&!/\n$/.test(ta.value)?ta.value+'\n':ta.value)+loc+' = ';
  ta.focus();ta.setSelectionRange(ta.value.length,ta.value.length);
  ta.scrollIntoView({block:'center'});
}
function parseLocMap(text){
  var map={},bad=[];
  String(text||'').split('\n').forEach(function(line){
    line=line.trim();if(!line)return;
    var i=line.indexOf('=');
    var l=i>0?normText(line.slice(0,i)):'',r=i>0?line.slice(i+1).trim():'';
    if(!l||!r){bad.push(line);return;}
    map[l]=canonCountry(r)||normText(r);
  });
  return{map:map,bad:bad};
}
function parseManagers(text){
  var out=[],bad=[];
  String(text||'').split(/\n/).forEach(function(line){
    line=line.trim();if(!line)return;
    var m=line.match(/[^\s,<>;]+@[^\s,<>;]+\.[^\s,<>;]+/);
    if(!m){bad.push(line);return;}
    var email=m[0],name=line.replace(email,'').replace(/[<>,;]/g,'').trim()||email.split('@')[0];
    out.push({name:name,email:email});
  });
  return{list:out,bad:bad};
}
function saveConnection(){
  var at=($('cn-at').value||'').trim(),dt=($('cn-dt').value||'').trim(),sc=($('cn-sc').value||'').trim();

function handleAct(el){
  var act=el.getAttribute('data-act');
  switch(act){
    case 'open':openPanel(el.getAttribute('data-kind'),el.getAttribute('data-id'));break;
    case 'close-panel':closePanel();break;
    case 'nav-prev':navStep(-1);break;
    case 'nav-next':navStep(1);break;
    case 'expand':_rowsExpanded=true;renderBoard();break;
    case 'collapse':_rowsExpanded=false;renderBoard();break;
    case 'tab':setTab(el.getAttribute('data-tab'));break;
    case 'jump-nearest':jumpNearest();break;
    case 'deep':deepSearch(el.getAttribute('data-q'));break;
    case 'deep-sweep':{var f=el.getAttribute('data-q');var tk=++_pn.tok;_pn.kind='deep';sweepApi(f,tk);break;}
    case 'deep-cancel':if(_deepCtrl){try{_deepCtrl.abort();}catch(e){}_deepCtrl=null;}var sb=$('ds-sweep');if(sb)sb.innerHTML='<p class="pn-note">Sweep cancelled.</p>';break;
    case 'clear-search':clearSearch();break;
    case 'load-period':loadVisiblePeriod();break;
    case 'copy':copyText(el.getAttribute('data-text')||'','Copied');break;
    case 'copy-summary':copyText(_pn.summary,'Summary copied');break;
    case 'jump':jumpTo(el.getAttribute('data-iso'),el.getAttribute('data-tab'));break;
    case 'retry-scid':{var a=_assignCache[_pn.id];if(a){var e1=$('pn-scid-val');if(e1)e1.innerHTML='<div class="sk" style="width:60%"></div>';resolveScidFor(a,_pn.tok);}break;}
    case 'retry-sc':if(_pn.scid)loadScCard(_pn.scid,_pn.tok);break;
    case 'retry-visa':retryVisa(el.getAttribute('data-email'));break;
    case 'settings':closePanel();openSettings();break;
    case 'map-loc':closePanel();openSettings({prefillLoc:el.getAttribute('data-loc')});break;
    case 'map-fill':fillLocLine(el.getAttribute('data-loc'));break;
    case 'save-conn':saveConnection();break;
    case 'cancel-modal':closeModal();break;
    case 'disconnect':disconnect();break;
    case 'view':setView(el.getAttribute('data-view'));break;
    case 'sort':setListSort(el.getAttribute('data-key'));break;
    case 'list-load':loadAdjacent(parseInt(el.getAttribute('data-dir'),10));break;
    case 'export-csv':exportCsv();break;
  }
}
function onDocClick(e){
  var t=e.target;if(!t||!t.closest)return;
  var act=t.closest('[data-act]');
  if(act&&!act.disabled){handleAct(act);return;}
  var card=t.closest('.ac[data-kind],.lrow[data-kind]');
  if(card){openPanel(card.getAttribute('data-kind'),card.getAttribute('data-id'));return;}
  var tab=t.closest('.sc-tab');
  if(tab){setTab(tab.getAttribute('data-tab'));return;}
  var chip=t.closest('[data-chip]');
  if(chip){toggleChip(chip.getAttribute('data-chip'));return;}
}
function trapTab(e,box){
  var f=Array.prototype.slice.call(box.querySelectorAll('a[href],button:not([disabled]),input:not([disabled]),textarea,select,summary,[tabindex]:not([tabindex="-1"])')).filter(function(x){return x.offsetParent!==null||x===document.activeElement;});
  if(!f.length){e.preventDefault();box.focus();return;}
  var first=f[0],last=f[f.length-1],act=document.activeElement;
  if(e.shiftKey&&(act===first||!box.contains(act))){e.preventDefault();last.focus();}
  else if(!e.shiftKey&&(act===last||!box.contains(act))){e.preventDefault();first.focus();}
}
function onDocKey(e){
  var t=e.target;
  // Modal and panel are real dialogs: Tab stays inside them.
  if(e.key==='Tab'){
    if(_modal.open){trapTab(e,$('modal'));return;}
    if(panelIsOpen()){trapTab(e,$('sc-panel'));return;}
  }
  if(e.key==='Escape'){
    if(_modal.open){if(hasCreds())closeModal();return;}
    if(panelIsOpen()){closePanel();return;}
    var si=$('search-input');
    if(_searchQuery||(si&&si.value)){clearSearch();}
    return;
  }
  // Activate cards and other role=button elements from the keyboard.
  if((e.key==='Enter'||e.key===' ')&&t&&t.closest){
    var card=t.closest('.ac[data-kind]');
    if(card&&t===card){e.preventDefault();openPanel(card.getAttribute('data-kind'),card.getAttribute('data-id'));return;}
  }
  // Roving tabindex on the tab strip.
  if(t&&t.closest&&t.closest('[role="tablist"]')&&['ArrowLeft','ArrowRight','Home','End'].indexOf(e.key)>=0){
    var order=visibleTabs(),i=order.indexOf(_activeTab);
    if(i<0)i=0;
    if(e.key==='ArrowLeft')i=(i-1+order.length)%order.length;
    else if(e.key==='ArrowRight')i=(i+1)%order.length;
    else if(e.key==='Home')i=0;else i=order.length-1;
    e.preventDefault();setTab(order[i],true);return;
  }
  var typing=t&&(t.tagName==='INPUT'||t.tagName==='SELECT'||t.tagName==='TEXTAREA'||t.isContentEditable);
  if(_modal.open)return;
  if(e.key==='/'&&!typing&&!panelIsOpen()){e.preventDefault();var inp=$('search-input');if(inp){inp.focus();inp.select();}return;}
  if(typing||e.ctrlKey||e.metaKey||e.altKey)return;
  if(e.key==='?'){e.preventDefault();openHelp();return;}
  if(panelIsOpen()){
    if(e.key==='ArrowLeft'&&(_pn.kind==='alloc'||_pn.kind==='unalloc')){e.preventDefault();navStep(-1);}
    else if(e.key==='ArrowRight'&&(_pn.kind==='alloc'||_pn.kind==='unalloc')){e.preventDefault();navStep(1);}
    return;
  }
  if(t&&t.id==='board-scroll-wrap'&&_customRange)return;   // let the keyboard scroll a wide custom range
  if(e.key==='v'||e.key==='V'){e.preventDefault();setView(_view==='list'?'calendar':'list');return;}
  if(_view==='list'&&(e.key==='ArrowLeft'||e.key==='ArrowRight'||e.key==='t'||e.key==='T'))return;   // week keys are calendar-only
  if(e.key==='ArrowLeft'){e.preventDefault();prevWeek();}
  else if(e.key==='ArrowRight'){e.preventDefault();nextWeek();}
  else if(e.key==='t'||e.key==='T'){e.preventDefault();goToday();}
  else if(e.key==='r'||e.key==='R'){e.preventDefault();refreshAll();}
  else if(e.key==='['){e.preventDefault();cycleTab(-1);}
  else if(e.key===']'){e.preventDefault();cycleTab(1);}
}

// ── BOOT ──────────────────────────────────────────────────────────────────────
function boot(){
  applyTheme();applyViewChrome();
  document.addEventListener('click',onDocClick);
  document.addEventListener('keydown',onDocKey);
  bindVisibilityPause();
  loadLocMap();
  try{localStorage.removeItem('scouter_cache_v1');}catch(e){}   // the old cache held visa records in plaintext
  if(!loadCreds()){setSt('Waiting for credentials\u2026');openConnect({first:true});return;}
  // Cached data belongs to one credential. Drop caches left behind by any other (e.g. replaced) token.
  try{Object.keys(localStorage).forEach(function(key){if(key.indexOf('scouter_cache_v2_')===0&&key!==cacheKey())localStorage.removeItem(key);});}catch(e){}
  start();
}

// ── scope ──
function inScope(sd,ed){
  var s=_list.scope,t=startOfToday();
  if(s==='all')return true;
  if(!sd||!ed)return false;                         // undated rows only appear under "All loaded"
  if(s==='upcoming')return ed>=t;
  if(s==='past')return ed<t;
  if(s==='month'){var a=new Date(t.getFullYear(),t.getMonth(),1),b=new Date(t.getFullYear(),t.getMonth()+1,0);return sd<=b&&ed>=a;}
  if(s==='next30')return sd<=addDays(t,30)&&ed>=t;
  return true;
}
// The span of everything loaded, so the "partly loaded" banner can still warn in list view.
function listBounds(){
  var keys=Object.keys(_quarters).sort();
  if(!keys.length){var q=getQuarter(new Date());return{start:q.start,end:q.end};}
  return{start:quarterFromKey(keys[0]).start,end:quarterFromKey(keys[keys.length-1]).end};
}
function adjacentQuarter(dir){
  var keys=Object.keys(_quarters).sort();
  if(!keys.length)return getQuarter(new Date());
  if(dir<0){var f=quarterFromKey(keys[0]).start;return getQuarter(new Date(f.getFullYear(),f.getMonth()-1,1));}
  var l=quarterFromKey(keys[keys.length-1]).end;
  return getQuarter(new Date(l.getFullYear(),l.getMonth(),l.getDate()+1));
}
function loadAdjacent(dir){
  if(_busy||!hasCreds())return;
  var q=adjacentQuarter(dir),ctrl=newLoadGeneration(),signal=ctrl.signal;
  renderBoard();
  loadQuarters([q],signal).then(function(errs){

  }).catch(function(e){
    if(isAbort(e))return;

    setLoadStatus('Load failed: '+e.message);
  }).then(function(){endBusy(ctrl);renderBoard();});
}

// ── rows ──
function listRows(){
  var tab=_activeTab,q=_searchQuery.trim().toLowerCase(),rows=[];
  if(tab==='Unallocated'){
    _unallocated.forEach(function(r){
      if(!itemPassesFilters(r,'Unallocated',q))return;
      var d=unallocDates(r);
      if(!inScope(d.sd,d.ed))return;
      var city=r['Assignment City']||'',ctry=r['Assignment Country']||'';
      var loc=city+(city&&ctry?', ':'')+ctry;
      var country=ctry?(canonCountry(ctry)||normText(ctry)):countryOf(loc);
      rows.push({kind:'unalloc',id:String(r.AssignmentID||''),sd:d.sd,ed:d.ed,course:r.Coursename||'',trainers:[],location:loc,country:country,
        mode:String(r['Delivery Mode']||'').trim().toUpperCase(),vendor:r.vendor||'',pax:toPax(r.NoOfParticipants),visa:null,
        tentative:r['Tentetive or Not']==='Yes',thirdParty:r['Third Party']==='Yes'});
    });
  }else{
    getAllAssignments(tab).forEach(function(a){
      if(!inScope(a.sDate,a.eDate))return;
      if(q&&!allocMatchesQuery(a,q))return;
      rows.push({kind:'alloc',id:a.assignId,sd:a.sDate,ed:a.eDate,course:a.course,trainers:a.trainers,location:a.location,country:countryOf(a.location),
        mode:a.mode,vendor:a.vendor,pax:a.pax,visa:a.mode==='ILT'?cardVisaStatus(a):null,datesVary:a.datesVary});
    });
  }
  return rows;
}
function sortRows(rows){
  var k=_list.sortKey,dir=_list.sortDir;
  var key={
    start:function(r){return r.sd?r.sd.getTime():null;},
    end:function(r){return r.ed?r.ed.getTime():null;},
    course:function(r){return String(r.course).toLowerCase();},
    trainer:function(r){return r.trainers.length?String(r.trainers[0].name).toLowerCase():null;},
    location:function(r){return r.location?String(r.location).toLowerCase():null;},
    mode:function(r){return String(r.mode||'').toLowerCase()||null;},
    vendor:function(r){return r.vendor?String(r.vendor).toLowerCase():null;},
    pax:function(r){return r.pax==null?null:r.pax;}
  }[k]||function(){return null;};
  rows.sort(function(a,b){
    var ka=key(a),kb=key(b);
    if(ka===null&&kb!==null)return 1;                // blanks always last, whichever way you sort
    if(kb===null&&ka!==null)return -1;
    if(ka!==kb&&ka!==null)return (ka<kb?-1:1)*dir;
    var sa=a.sd?a.sd.getTime():0,sb=b.sd?b.sd.getTime():0;
    if(sa!==sb)return sa-sb;
    return String(a.course)<String(b.course)?-1:String(a.course)>String(b.course)?1:0;
  });
  return rows;
}
function groupRows(rows){
  var g=_list.group;
  if(g==='none'||(g==='trainer'&&_activeTab==='Unallocated'))return[{label:'',rows:rows}];
  var map={},order=[];
  function put(label,r){if(!map[label]){map[label]={label:label,rows:[]};order.push(label);}map[label].rows.push(r);}
  rows.forEach(function(r){
    if(g==='trainer'){
      if(!r.trainers.length)put('Unassigned',r);
      else r.trainers.forEach(function(t){put(t.name,r);});          // an assignment appears under each of its trainers
    }else if(g==='country')put(r.country?countryDisplay(r.country):'Country unknown',r);
    else if(g==='mode')put(r.mode||'No mode set',r);
    else if(g==='month')put(r.sd?MONTHS[r.sd.getMonth()]+' '+r.sd.getFullYear():'No date',r);
  });
  var cmp=function(a,b){
    var ua=/^(Unassigned|Country unknown|No mode set|No date)$/.test(a),ub=/^(Unassigned|Country unknown|No mode set|No date)$/.test(b);
    if(ua!==ub)return ua?1:-1;
    return a<b?-1:a>b?1:0;
  };
  if(g==='month')order.sort(function(a,b){
    if(a==='No date')return 1;if(b==='No date')return -1;
    var A=map[a].rows[0].sd,B=map[b].rows[0].sd;return (A.getFullYear()*12+A.getMonth())-(B.getFullYear()*12+B.getMonth());
  });
  else if(g==='mode')order.sort(function(a,b){var ia=TAB_ORDER.indexOf(modeBucket(a)),ib=TAB_ORDER.indexOf(modeBucket(b));return ia-ib||cmp(a,b);});
  else order.sort(cmp);
  return order.map(function(l){return map[l];});
}

function renderList(){

  var seen={};rows.forEach(function(r){var k=r.kind+':'+r.id;if(!seen[k]){seen[k]=1;_boardOrder.push({kind:r.kind,id:r.id});}});

  if(!rows.length){
    var msg=q?'Nothing matches \u201c'+q+'\u201d here.':(_list.scope!=='all'?'Nothing in this scope. Try \u201cAll loaded\u201d.':'No '+(_activeTab==='All'?'':_activeTab+' ')+'assignments loaded yet.');
    wrap.innerHTML='<div class="list-empty">'+es(msg)+(q?'<div class="hint-bar"><button class="btn" data-act="deep" data-q="'+es(q)+'">Search everywhere</button></div>':'')+'</div>';
    $('sum-bar').innerHTML='<span>Nothing to show</span>';
    return;
  }

  var cols=[['start','Dates'],['course','What'],['trainer','Allocated to'],['location','Where'],['mode','Mode'],['vendor','Vendor'],['pax','Pax'],[null,'Visa']];
  if(_activeTab==='Unallocated')cols[7]=[null,''];
  var head='<thead><tr>'+cols.map(function(c){
    if(!c[0])return '<th scope="col">'+(c[1]?'<span class="lt-sort" style="cursor:default">'+c[1]+'</span>':'')+'</th>';
    var on=_list.sortKey===c[0],arrow=on?(_list.sortDir===1?' \u25B2':' \u25BC'):'';
    return '<th scope="col" aria-sort="'+(on?(_list.sortDir===1?'ascending':'descending'):'none')+'"><button type="button" class="lt-sort" data-act="sort" data-key="'+c[0]+'">'+c[1]+arrow+'</button></th>';
  }).join('')+'</tr></thead>';

  var groups=groupRows(rows),body='<tbody>',today=startOfToday();
  var canMarkToday=_list.sortKey==='start'&&_list.sortDir===1&&_list.group==='none'&&_list.scope!=='past'&&_list.scope!=='upcoming';
  groups.forEach(function(g){
    if(g.label)body+='<tr class="lt-grp"><td colspan="8">'+es(g.label)+'<small>'+g.rows.length+' assignment'+(g.rows.length!==1?'s':'')+'</small></td></tr>';
    var marked=false;
    g.rows.forEach(function(r){
      if(canMarkToday&&!marked&&r.ed&&r.ed>=today){
        marked=true;
        body+='<tr class="lt-today" id="lt-today"><td colspan="8"><div>Today \u00b7 '+es(formatDisplay(today,true))+'</div></td></tr>';
      }
      body+=listRowHtml(r);
    });
  });
  body+='</tbody>';
  wrap.innerHTML='<table class="lt">'+head+body+'</table>';

  // summary: the answer to "how many, who, where"
  var trainers={},countries={},pax=0,unk=0;
  rows.forEach(function(r){
    r.trainers.forEach(function(t){trainers[vkey(t.email||t.name)]=1;});
    if(r.country)countries[r.country]=1;
    if(r.pax==null)unk++;else pax+=r.pax;
  });
  var s='<span><span class="sum-n">'+rows.length+'</span> assignment'+(rows.length!==1?'s':'')+'</span>';
  if(_activeTab!=='Unallocated')s+='<span><span class="sum-n">'+Object.keys(trainers).length+'</span> trainers</span>';
  s+='<span><span class="sum-n">'+Object.keys(countries).length+'</span> countr'+(Object.keys(countries).length===1?'y':'ies')+'</span>';
  s+='<span><span class="sum-n">'+pax+'</span> participants'+(unk?' (+'+unk+' unknown)':'')+'</span>';
  var um=rows.filter(function(r){return r.visa&&r.visa.state==='unknown'&&!r.visa.country;}).length;
  if(um)s+='<span><button class="search-clear" type="button" data-act="settings" style="color:var(--risk);font-weight:600">'+um+' with an unrecognised location</button></span>';
  $('sum-bar').innerHTML=s;

  if(_list.scrollToToday){
    _list.scrollToToday=false;
    fitBoard();
    var m=$('lt-today');
    if(m){
      var th=wrap.querySelector('thead'),hh=th?th.getBoundingClientRect().height:0;
      wrap.scrollTop=Math.max(0,m.getBoundingClientRect().top-wrap.getBoundingClientRect().top+wrap.scrollTop-hh-6);
    }else wrap.scrollTop=0;
  }
}

// ── CSV ──
function csvCell(v){
  var s=String(v==null?'':v);
  if(/^[=+\-@\t\r]/.test(s))s="'"+s;                // stop spreadsheet formula injection
  return '"'+s.replace(/"/g,'""')+'"';
}
function exportCsv(){
  var rows=sortRows(listRows());
  if(!rows.length){toast('Nothing to export');return;}
  var head=['Start','End','Assignment ID','Course','Allocated to','Trainer emails','Location','Country','Mode','Vendor','Participants','Visa'];
  var lines=[head.map(csvCell).join(',')];
  rows.forEach(function(r){
    lines.push([r.sd?toISO(r.sd):'',r.ed?toISO(r.ed):'',r.id,r.course,
      r.kind==='unalloc'?'(unallocated)':r.trainers.map(function(t){return t.name;}).join('; '),
      r.trainers.map(function(t){return t.email||'';}).join('; '),
      r.location,r.country?countryDisplay(r.country):'',r.mode,r.vendor,r.pax==null?'':r.pax,
      r.visa?(VISA_SHORT[r.visa.state]+(r.visa.country?' ('+countryDisplay(r.visa.country)+')':'')):''].map(csvCell).join(','));
  });
  var blob=new Blob(['\ufeff'+lines.join('\r\n')],{type:'text/csv;charset=utf-8'});
  var a=document.createElement('a');
  a.href=URL.createObjectURL(blob);a.download='scouter-'+(_activeTab==='All'?'allocations':_activeTab.toLowerCase())+'-'+toISO(new Date())+'.csv';
  document.body.appendChild(a);a.click();document.body.removeChild(a);
  setTimeout(function(){URL.revokeObjectURL(a.href);},2000);
  toast('Exported '+rows.length+' row'+(rows.length!==1?'s':''));
}
